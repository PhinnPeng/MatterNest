# MatterNest 反向代理（MATT-71）
#
# ## 这份文件为什么存在
#
# 它是**第一次**存在。全仓此前没有任何反向代理配置（`nginx` / `proxy_pass` /
# `proxy_read_timeout` 零命中），而已经有一条实测出来的硬需求没有落点：
# **批量导入 1000 行 = 81.0s**（MATT-44，81ms/行、逐行一事务的代价）。
#
# ## 部署形态：单副本（MATT-35，2026-10-13 裁定「一期单副本」）
#
# 单副本下**不需要**的东西，逐条记在这里免得下一个人又去加：
#   · `NEXT_SERVER_ACTIONS_ENCRYPTION_KEY` / `deploymentId`：MATT-35 已证伪
#     ——`src/` 全域对 `use server` / `useActionState` / `useFormStatus` /
#     `<form action=` 零命中（2026-10-13 复核仍为 0），全走 `/api/*` route handler，
#     没有 Server Function 闭包可供加密。
#   · 多 upstream 负载均衡、keepalive 到多个后端。
#
# 但**单副本不等于配置可以写死**：下面 `location = /api/import` 里的
# `proxy_next_upstream off;` 就是为「将来加第二个副本」准备的，理由见该处。
#
# ## 改这份文件之前先读 `deploy/README.md` 的「不能不改的值」一节。
#
# 依赖：官方 `nginx:1.27-alpine` 镜像。本文件自带 `events{}` 与 `http{}`，
# 因此 `nginx -t -c /etc/nginx/nginx.conf` 可以直接跑（证书不存在时那一段是注释）。

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # ── 基础 ────────────────────────────────────────────────────────────────
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 容器里不做 DNS 预解析（`resolver` 未配），关掉可省掉每次上游解析的阻塞。
    # 单副本 + compose 内部 DNS 是静态的，收益确定。
    server_tokens off;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout  65s;
    client_body_timeout 60s;

    # 单副本：上游只有一个。后端进程死掉时**立刻**失败，不要挂在连接上等满 60s。
    # 与 `proxy_next_upstream off` 是一对，见下。
    proxy_connect_timeout 5s;

    # ── 请求体上限（安全项，技术选型 §6 第 3 条 / deploy/README.md 原第 3 条）──
    #
    # ⚠ **框架侧按设计不设 body limit**（附件走预签名 PUT 直传 MinIO，
    #   后端不中转文件流）。所以**这一层是唯一的一道**：没有它，
    #   一个匿名可发的巨大 body 请求就是内存/带宽放大器。
    #
    # 1m 是给「除导入外的一切」的上限。逐条核过本仓所有写入端点的 schema 上限：
    #   · 评论正文        2000 字符（`shared/schema/hosts.ts:273`）
    #   · 案件/事项描述   5000 字符（`shared/schema/hosts.ts:89,109`）
    #   · 批量操作        50 个 id（`MAX_BATCH_IDS`，`shared/schema/batch.ts:35`）
    #   · 转案件          20 个案件（`MAX_CASES_PER_CONVERT`）
    #   · 口令            128 字符
    # 最大的一条也就几 KB，1m 已经很宽。
    client_max_body_size 1m;

    # ── 长请求：一等公民，不是导入的特例 ──────────────────────────────────
    #
    # 全局地板抬到 **90s**。理由：下面 60s 的默认值在本仓是**会 504 的那个值**
    # （见 `location = /api/import`）。任何新加的慢接口默认继承 90s 而不是 60s，
    # 意味着「忘了调」的后果从「必然 504」降级成「可能要再看一眼」。
    #
    # ⚠ 这是**地板**不是保证。真正必须够长的写在各自的 location 里。
    proxy_read_timeout 90s;

    upstream matternest_app {
        # 单副本（MATT-35）。加第二个副本前先读 `location = /api/import` 的注释。
        server app:3000;
        keepalive 32;
    }

    # 上游 keepalive 要显式清掉 Connection 头（`Connection: close` 会让 keepalive 失效）
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # ── server ──────────────────────────────────────────────────────────────
    server {
        # 一期内网自用、无公网域名（MATT-34 云之家联调前域名未定死）⇒ 先只听 80。
        # **TLS 终结尚未启用**：启用时把下面整段取消注释，并把证书挂进
        # `docker-compose.yml` 的 nginx 服务。签发与续期口径属 MATT-36（HITL），
        # 本文件不自行决定托管方式。
        listen 80;
        server_name _;

        # 静态资源：内容寻址（`_next/static/` 带 hash），可以放心长缓存。
        location /_next/static/ {
            proxy_pass http://matternest_app;
            proxy_cache_valid 200 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # ══════════════════════════════════════════════════════════════════
        # 批量导入 —— 全仓唯一的实测长请求，也是全仓唯一的 504 来源
        # ══════════════════════════════════════════════════════════════════
        #
        # **实测（MATT-44）：1000 行 = 81.0s**，81ms/行，逐行一事务。
        #
        # nginx 默认 `proxy_read_timeout 60s` ⇒ 这条请求**必然 504**，
        # 而**服务端会把那 81 秒跑完、事务照常提交**。
        # 于是：客户端看到失败 ⇒ 用户重试 ⇒ 第二个请求再跑 81 秒、再写一份库。
        # （导入有内容幂等键兜底，不会重复建记录 —— 但时间是实打实再花一遍。）
        # 「客户端看起来失败、服务端其实成功」是最难排查的那一类形状。
        #
        # 180s = 81s 实测 × 2.2 余量。裁决要求是 ≥120s；取 180s 而不是贴着 120s，
        # 因为 81.0s 是在**开发机**上量的，生产机更慢的概率大于更快。
        location = /api/import {
            proxy_read_timeout 180s;

            # 发请求体给上游的时限。导入的 JSON body 最大 ~8MB（见下一条），
            # 慢链路上 `send` 与 `read` 一样会断。
            proxy_send_timeout 180s;

            # **请求体上限必须单独放开**：应用自己的 schema 允许
            # `MAX_IMPORT_CSV_CHARS = 2_000_000` **字符**（`shared/schema/import.ts:195`）。
            # 中文在 UTF-8 里 3 字节/字符 ⇒ 光 csv 字段上界就是 6,000,000 字节 ≈ 5.72 MiB。
            # `deploy/README.md` 里「2MB 就够了」那条旧建议会**在导入跑起来之前**
            # 就 413 掉它 —— 1000 行上限与 81s 实测都是按这个 body 上限定的。
            # 8m = 6,000,000 × 1.4 的余量。
            # `verify-deploy.mjs` 会**从 schema 源码里把这个上界算出来**再断言，
            # 所以改 `MAX_IMPORT_CSV_CHARS` 而忘了改这里，断言会红。
            client_max_body_size 8m;

            # ⚠ **默认是 `error timeout`，也就是 nginx 会在超时后自己重试一次。**
            # 单副本时只有一个 upstream，重试是空操作；但**加第二个副本的那一刻**，
            # 一个超时的导入会被原样再发一遍 —— 于是「重试两次」的代价从
            # 「用户点了一下」变成「用户没点、nginx 自己点了两次」。
            # 这里显式关掉：重试的决定权交回客户端，而客户端的重试用户看得见。
            proxy_next_upstream off;
        }

        # 导入的其它子路径（批次列表 / 模板 / 报告下载）都很轻，
        # 走下面的 /api/ 地板即可 —— 不需要也不应该跟着放大。

        # ── 其余 /api/** ────────────────────────────────────────────────────
        # 已逐个核过慢接口，结论记在 `deploy/README.md` 的「为什么只有导入需要
        # 180s」一节（整卷导出、通知 pump、批量操作、转案件都不撞 60s，
        # 各自有代码里的硬上界）。
        #
        # 继承 http{} 的 `proxy_read_timeout 90s` 与 `client_max_body_size 1m`。
        location /api/ {
            proxy_pass http://matternest_app;
        }

        # 页面壳 SSR 与其余静态资源。
        location / {
            proxy_pass http://matternest_app;
            # 计划书 §1 把 `X-Accel-Buffering: no` 列为 nginx 职责。
            # 诚实说明：它是为流式响应准备的，而本仓**当前没有任何流式端点**
            # （导入/导出都是「算完一次性返回」的单个 JSON/CSV 文本）。
            # 所以这里是保险而不是承重结构 —— 将来真加了 SSE 之类的端点，
            # 把它挪到那个 location 去。
            proxy_buffering off;
        }
    }

    # ── TLS（未启用；启用方式见 server{} 内的说明）─────────────────────────
    # listen 443 ssl;
    # http2 on;
    # server_name mn.example.internal;   # ← 域名未定死（MATT-34 联调前拍）
    #
    # ssl_certificate     /etc/nginx/tls/fullchain.pem;   # ← 占位，托管口径属 MATT-36
    # ssl_certificate_key /etc/nginx/tls/privkey.pem;     # ← 占位，同上
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_session_cache shared:SSL:4m;
    # ssl_session_timeout 1h;
}