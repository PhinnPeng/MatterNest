<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>MatterNest · 登录</title>
<link rel="stylesheet" href="world.css">
<style>
body{display:block}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--paper)}
.panel{width:1080px;height:560px;display:grid;grid-template-columns:1fr 1fr;background:var(--card);border:1px solid var(--line);border-radius:3px;overflow:hidden}
.aside{background:linear-gradient(165deg,#1F2A2C 0%,#2B3B3E 100%);color:var(--paper);display:flex;flex-direction:column;padding:44px 48px}
.aside .wm{font:15px/1 var(--serif);letter-spacing:.16em}
.aside h1{font:400 26px/1.5 var(--serif);letter-spacing:.06em;margin-top:auto}
.aside .rule{width:44px;border-top:2px solid var(--cinnabar);margin:18px 0 0}
.form{display:flex;flex-direction:column;justify-content:center;padding:56px 72px}
.form h1{font:400 22px/1 var(--serif);letter-spacing:.08em;margin-bottom:28px}
.form label{display:block;font-size:12px;color:var(--ink2);margin:14px 0 6px}
.form .ipt{width:100%;height:40px;font-size:13px}
.form .btn{width:100%;height:40px;font-size:13px;margin-top:24px}
</style>
</head>
<body>
<div class="stage">
  <div class="panel">
    <div class="aside">
      <div class="wm">MatterNest</div>
      <h1>风险事项与案件<br>全生命周期</h1>
      <div class="rule"></div>
    </div>
    <div class="form">
      <h1>登录</h1>
      <label>账号</label>
      <input class="ipt" placeholder="企业账号">
      <label>密码</label>
      <input class="ipt" type="password" placeholder="口令">
      <button class="btn pri">登录</button>
    </div>
  </div>
</div>
</body>
</html>
