name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 门禁 + 数据库 + 全组冒烟
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dev_matternest
          POSTGRES_PASSWORD: dev_matternest
          POSTGRES_DB: dev_matternest
        ports:
          - 30432:5432
        options: >-
          --health-cmd "pg_isready -U dev_matternest"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      PGHOST: 127.0.0.1
      PGPORT: 30432
      PGDATABASE: dev_matternest
      # ⚠ `PGUSER` / `PGPASSWORD` **故意不在 job 级 env 里**（MATT-87）。
      #
      # 镜像把 `POSTGRES_USER` 建成 SUPERUSER，而 `db:check` 的 C3 恰好是「应用角色不该是
      # 超级用户」的探针 —— 所以整条流水线必须在**非超级用户**下跑。
      #
      # 它们由下面「建非超级用户角色」那一步写进 `$GITHUB_ENV`。若留在 job 级 env，
      # job env 会在 `$GITHUB_ENV` **之后**生效、把刚写进去的值盖掉 ⇒ 后面每一步又会悄悄
      # 用回超级用户，而 C3 要等几分钟后才红，还报成一条与真因无关的错。
      PG_POOL_MAX: 10
      PG_SESSION_TIMEZONE: UTC
      NODE_ENV: development
      LOG_LEVEL: info
      MN_DB_CONFIRM: dev_matternest
      MN_CI_APP_ROLE: mn_app

      # ⚠ 本企业名（IQ-7「我方永不入当事人表」防呆），2026-10-15 补上。
      #
      # 为什么必填：`src/app/lib/server/services/parties.ts:84` 读不到它就**抛错**，
      # 而这是**刻意不给默认值**的 —— 「本企业叫什么」猜不出来，猜错会让防呆失效
      # （我方被当成对方写进当事人表）。于是任何碰「我方」的写操作在 CI 上都是 500。
      #
      # 2026-10-15 那次红就是这么来的：CI 从没注入过它，而本地 `.env` 有 ⇒
      # 全组冒烟 8/17 失败、443 断言通过 / 21 失败，**而根因只是少一个环境变量**。
      # 一个部署事实的缺失，伪装成了一堆断言失败。
      #
      # 值是**合成**的：CI 的库每次新建、只装演示数据，用真公司名没有意义，
      # 而真名出现在 CI 日志里反倒是个风险。固定值（不随机）——否则依赖本企业名的
      # 断言会带上一个每次都不同的前提。
      #
      # ⚠ **不要** `add-mask`：它不是密钥，抹掉只会让日志说谎
      # （真密钥那三把才需要 mask，见下面「产出三把密钥」那一步）。
      MN_OWN_COMPANY_NAMES: 冒烟测试股份有限公司

      # ⚠ 这里**没有**三把密钥，而且这是有意的（MATT-36 决策第 4 项）。
      #
      # 原先是 `secrets.X || '<固定占位>'`，两个问题都被这次改动去掉：
      #   1. **`MN_AES_KEY` 与 `MN_HMAC_KEY` 的兜底值逐字相同**（两个 64 个 0）——
      #      直接违反 NIST SP 800-57 Pt1 R5 §5.2 的 `shall`（一条 key 只做一个用途），
      #      而且是**我们自己 CI 里现存的**。启动期自检现在会拦这种形态，
      #      留着这个占位值 CI 自己就起不来；
      #   2. `||` 回落让「secret 名字配错」在 CI 里**永远看不出来**。
      #
      # 改成下面那一步 `pnpm keys:gen` 每次运行现生成：CI 的库每次新建、只装演示数据，
      # 本就该用一次性密钥（OWASP SM §2.7.1 要求密钥「cryptographically robust enough
      # for their purpose」，固定明文不满足）。顺带让 CI 每天走一遍真实产出路径，
      # 工具坏了 CI 就红。

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: pnpm verify（format / lint / typecheck / test / lint-guard / anchors / deploy）
        run: pnpm verify

      # ⚠ 必须在**起 dev server 之前**，且在 `pnpm verify` 之后 ——
      # `tools/keys.spec.ts` 会 `gen --force` 跑真工具，而 verify 里的启动期断言
      # （三把互不相同、pepper 长度）依赖这些性质成立。
      #
      # `--force` 在这里不危险：护栏看的是 `deploy/.env` 与 `.env`，CI 里两个都不存在
      # （`.env` 被 gitignore）⇒ 护栏本来就空触发。写出来只为让「此处确实是空环境」显式。
      #
      # 那句 `if [ "$n" -ne 3 ]` 是 canary：工具的输出格式若变了、grep 捞不到值，
      # 没有它 CI 会带着**空密钥**继续往下跑，然后在起 dev server 时报一个
      # 与真因无关的错。有了它，产出这一步自己就红。
      #
      # 值只经 `$GITHUB_ENV` 进后续 step 的进程环境；**不进任何 echo**，
      # 且下面显式 `add-mask` —— 因为 GitHub 会把每个 step 的完整 env 打进日志，光「不 echo」不够。
      - name: 产出三把密钥（MATT-36：不再用固定占位值）
        run: |
          vals="$(node tools/keys.mjs gen --force | grep -E '^[A-Z0-9_]+=')"
          n="$(printf '%s\n' "$vals" | grep -c '=')"
          if [ "$n" -ne 3 ]; then
            echo "::error::只捞到 $n 行 KEY=value，应为 3 行 —— 生成器输出格式变了？"
            printf '%s\n' "$vals" | sed 's/=.*/=<已隐去>/'
            exit 1
          fi
          # ⚠⚠ **必须 add-mask**，否则三把密钥明文躺在每次 run 的日志里（2026-10-15 实测）。
          #
          # 原注释写的是「值只经 GITHUB_ENV 进后续 step 的进程环境，**不进任何 echo / 日志**」——
          # **那句话是错的**：GitHub Actions 会把**每个 step 的完整 env** 打进日志，
          # 于是 GITHUB_ENV 里的三把值在下一�� step 的 env 块里逐字出现。
          # 仓库里没注册成 secret，所以 GitHub 也不会自动抹。
          #
          # 不 echo 不够 —— 要显式告诉 GitHub 把这三个值从日志里抹掉。
          printf '%s\n' "$vals" | while IFS= read -r line; do
            echo "::add-mask::${line#*=}"
          done
          printf '%s\n' "$vals" >> "$GITHUB_ENV"
          echo "已注入 3 把（已 add-mask）"

      # ⚠ 必须在**迁移之前**：从这一步交出去之后，流水线剩下的每一步都改用非超级用户角色。
      #
      # 超级用户**只**出现在这个 step 的 `env:` 里（step 级 env 覆盖 job 级）。
      # 它必须存在 —— 镜像的 `POSTGRES_USER` 得起得来，而且是唯一能 `CREATE ROLE` 的入口；
      # 但它建出来的角色是给后面每一步用的**非超级用户**（`nosuperuser nocreatedb
      # nocreaterole`，并且是库属主 + `public` 属主，与本地那条已验证可跑通的姿态一致 ——
      # 调研见 `docs/research-ci-role-privileges.md`）。
      #
      # 口令现生成、不落库不进 git（与 MATT-36 同一形状）。`add-mask` 让它即便被某条
      # 连接错误顺带打出来也会被 GitHub 抹掉。
      #
      # 那一步工具自带的复核会在**这里**就红（不是等几分钟后 C3 才红）：
      # 它会用建出来的凭据换一个连接，逐项验 rolsuper / rolcreatedb / rolcreaterole /
      # 自有库 / public 可建 —— 与 APP_ROLE_MUST 一致。
      - name: 建非超级用户角色并分权（MATT-87：C3 要求应用角色不是超级用户）
        env:
          # ⚠ 超级用户只在这一步。这三行就是本流水线里它全部的曝光面。
          PGUSER: dev_matternest
          PGPASSWORD: dev_matternest
        run: |
          pw="$(node -e "console.log(require('node:crypto').randomBytes(24).toString('base64url'))")"
          echo "::add-mask::$pw"
          MN_CI_APP_PASSWORD="$pw" node tools/ci-provision-role.mjs
          {
            echo "PGUSER=$MN_CI_APP_ROLE"
            echo "PGPASSWORD=$pw"
          } >> "$GITHUB_ENV"
          echo "已交接：迁移 / seed / dev server / db:check / 冒烟全部改用 $MN_CI_APP_ROLE"

      - name: 迁移 + seed（已切到非超级用户）
        run: |
          pnpm db:migrate
          pnpm db:seed

      - name: 起 dev server（后台）
        run: |
          pnpm dev > /tmp/next-dev.log 2>&1 &
          echo "DEV_PID=$!" >> "$GITHUB_ENV"
          # 等它就绪（探 /login，不是 / —— 那个会重定向）
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3777/login > /dev/null 2>&1; then
              echo "dev server ready"
              exit 0
            fi
            sleep 1
          done
          echo "dev server 未能在 30s 内就绪"
          cat /tmp/next-dev.log
          exit 1

      # ⚠ 顺序：**(起 server) → 等首轮心跳 → db:check → 冒烟**。
      #
      # 为什么 db:check 必须在 dev server **之后**：`src/instrumentation.ts`（MATT-74）落地后，
      # C18 从 `info` 变成**硬断言**（要求心跳行有 15 分钟内的成功 pump）。把它放在 server
      # 之前，那一刻 `created_at` 必然是 NULL ⇒ 它报「定时器从未运行」——**那个红是顺序错了，
      # 不是缺陷**，而一条永远红的门禁等于没有门禁。
      #
      # 为什么用「等」而不是把 db:check 挪到冒烟之后：挪到之后等于让 C18 在 CI 里
      # **不成立地绿**（没有任何东西保证定时器在那之前跑过）；而把 C18 降回 info 等于
      # 把门禁关掉。显式地等一次，换来的是**这一步本身就是「定时器在 CI 里真的起来了」的断言**
      # ——比 C18 更强：C18 只读一行数据，判不出那行是谁写的。
      #
      # 预算 180s 只覆盖「dev server 起来 + 首次编译」：定时器首轮是**立即执行**的
      # （MATT-74 的 `job.trigger()`），不等第一个 5 分钟槽位。
      - name: 等定时器的第一次心跳（MATT-74 前置件）
        run: node tools/wait-heartbeat.mjs 180

      - name: db:check（C18：从未运行 vs 已停摆，两种红分开报）
        run: pnpm db:check

      - name: 全组冒烟（17 脚本 / 串行）
        run: pnpm smoke

      - name: 停 dev server
        if: always()
        run: |
          if [ -n "$DEV_PID" ]; then
            kill "$DEV_PID" 2>/dev/null || true
            sleep 2
            kill -9 "$DEV_PID" 2>/dev/null || true
          fi

      - name: 上传 dev server 日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: next-dev-log
          path: /tmp/next-dev.log
          retention-days: 7
