<!--
  ════════════════════════════════════════════════════════════════════════════
  PROTOTYPE — 一次性产物，不进主干（prototype/p9-p18-2026-10-17 分支）。
  回答的问题是：「对手方列表这一页长什么样？」

  【对照的已交付实现】主仓 main 的 `src/app/(desk)/parties/parties-view.tsx`（MATT-40 / T3）。
  形态逐项照它做，不发明新控件：
    · 页面 = 查询区卡（关键词，提交式）+ 一张 DataTable 卡（标题「当事人档案」）；
    · 列：名称 / 类型 / 证件号 / 联系方式 / 涉及案件 / 涉及事项 / 更新；
      **证件号与手机号是明文**（IQ-12：展示层全明文，没有「显示明文」按钮，也不逐次审计）；
    · 排序只有名称与更新时间两列（服务端把 sortBy 收窄成两个字面量）；
    · 工具栏：刷新 / 导出（脱敏｜含明文证件号，后者要 can_read_plain）/ 新建当事人；
    · 行的旗舰动作是**打开档案**——列表这层不做合并（合并要看清两边卷入了什么，
      那需要详情页那两张表）。

  【本页承载的 F】F3-1 列表/搜索（"部分结果因权限未显示"）；F3-2 新建/编辑
  （仅名称必填；输入本企业名提示而非建档）；F3-3 查重（名称模糊 + id_number_hash 精确）。

  【变体 = 这一页真会遇到的几种态】右下角浮条或 ?variant= 切换：
    A 默认列表      —— 有数据、有权限（导出两项都可点）
    B 新建 · 本企业名 —— 输入本企业名，当场说清我方不入表（F3-2 防呆）
    C 新建 · 同名     —— 库里已有同名，说明会另建一行并给「去合并」的下一步（F3-3）
    D 新建 · 证件号命中 —— 粘完整证件号精确命中（id_number_hash）+ 409 撞号提示（F3-3）
    E 空态           —— 零档案（落点①：说清下一步怎么建档）
    F 筛选空         —— 关键词命中 0 条（落点①：说清是筛选造成的）
    G 只读（无 can_read_plain） —— 导出菜单里「含明文证件号」不可点（界面不摆必被拒的动作）

  ⚠ 文案纪律（`.trellis/spec/frontend/component-guidelines.md`「副标题纪律」+ AGENTS.md）：
    本文件不在 src/ 下，lint-guard 的源码断言扫不到它 —— 只剩立场能拦，所以逐句过了：
    · 标题下**没有**第二行说明（"对手方是仅对方/第三人的档案"这种就是复述 + 讲规则）；
    · 取值/权限/排序规则落进 tooltip（落点③）与空态（落点①）；
    · 表单的说明走控件下方 extra（落点②），不在页头讲。

  数据为内存假数据（真实库不可达）。色板抄自 src/app/theme/brand.ts，外壳照抄 AppShell。
  ════════════════════════════════════════════════════════════════════════════
-->

  const hints = {
    self: `<div class="note warn"><span>⚠</span><div><b>这是本企业名称，我方不入当事人表</b><br>
      本企业在案件中的地位由该案的「我方诉讼地位」表达。这一栏请填对方当事人或第三人。</div></div>`,
    same: `<div class="note info"><span>ⓘ</span><div><b>库里已有同名档案：恒基建设集团有限公司</b><br>
      同名可能是两家，所以这里会新建一行而不是自动合并；确认是同一家，建档后到详情页把它们合并。</div>
      <div class="hits" style="margin:8px 0 0">${HITS_NAME.map(h=>`<div class="hit">
        <span>${esc(h.name)}</span><span class="faint num">${esc(h.tail)}</span>
        <span class="lbl g">案件 ${h.m} · 事项 ${h.r}</span>
      </div>`).join('')}</div></div>`,
    idn: `<div class="note info"><span>ⓘ</span><div><b>证件号已命中一份档案</b><br>
      同证件号在库里唯一，继续建档会被拒；这份大概率就是你要挂的那一家。</div>
      <div class="hits" style="margin:8px 0 0">${HITS_IDN.map(h=>`<div class="hit">
        <span>${esc(h.name)}</span><span class="faint num">${esc(h.tail)}</span>
        <span class="lbl g">案件 ${h.m} · 事项 ${h.r}</span>
      </div>`).join('')}</div></div>`,
    err409: `<div class="note bad"><span>⚠</span><div><b>该证件号已在库，不能再建一份</b><br>
      在列表的关键词框里粘一次完整证件号就能搜到它。</div></div>`,
  }[kind] || '';
  const nameVal = kind==='self' ? SELF_NAME : kind==='same' ? '恒基建设集团有限公司' : kind==='idn'||kind==='err409' ? '恒基建设集团有限公司' : '';
  const idnVal = kind==='idn'||kind==='err409' ? '91320100MA1KC41J2B' : '';
  return `<div class="mask on" id="createMask">
    <div class="modal">
      <div class="modal-h">新建对手方档案</div>
      <div class="modal-b">
        ${hints}
        <div class="fi">
          <label class="fi-l"><span class="req">*</span>名称</label>
          <input value="${esc(nameVal)}" placeholder="例：南京鼎泰房地产开发有限公司">
        </div>
        <div class="fi">
          <label class="fi-l">类型</label>
          <select><option>企业法人</option><option>自然人</option><option>非法人组织</option><option>其他</option></select>
        </div>
        <div class="fi">
          <label class="fi-l">证件类型</label>
          <select><option>选填</option><option>统一社会信用代码</option><option>居民身份证</option><option>组织机构代码</option></select>
        </div>
        <div class="fi">
          <label class="fi-l">证件号</label>
          <input value="${esc(idnVal)}" placeholder="统一社会信用代码 / 身份证号">
          <div class="fi-x">加密存储；列表与详情页按明文显示。同名不拦、同证件号拦——证件号是查重的精确那一半。</div>
        </div>
        <div class="fi">
          <label class="fi-l">联系方式</label>
          <input placeholder="手机号等">
          <div class="fi-x">加密存储。</div>
        </div>
        <div class="fi" style="margin-bottom:0">
          <label class="fi-l">备注</label>
          <textarea rows="2" maxlength="2000"></textarea>
        </div>
      </div>
      <div class="modal-f">
        <button class="btn">取消</button>
        <button class="btn p">建档</button>
      </div>
    </div>
  </div>`;
}

/* ══════════════ 变体 ══════════════ */
const V = {
  A:{n:'默认列表（有数据/有权限）', f:()=> queryFilter()+dataTable(rowsHtml(ROWS), PAGER)},
  B:{n:'新建 · 输入本企业名（F3-2 防呆）', f:()=> queryFilter()+dataTable(rowsHtml(ROWS), PAGER)+createModal('self')},
  C:{n:'新建 · 库里已有同名（F3-3 名称模糊）', f:()=> queryFilter()+dataTable(rowsHtml(ROWS), PAGER)+createModal('same')},
  D:{n:'新建 · 完整证件号命中，建档被拒（F3-3 精确）', f:()=> queryFilter()+dataTable(rowsHtml(ROWS), PAGER)+createModal('err409')},
  E:{n:'空态 · 零档案', f:()=> queryFilter()+dataTable(EMPTY_NONE,'')},
  F:{n:'空态 · 筛选命中 0 条', f:()=> queryFilter()+dataTable(EMPTY_FILTER,'')},
  G:{n:'只读 · 无 can_read_plain', f:()=> queryFilter()+dataTable(rowsHtml(ROWS), PAGER)},
};
const keys = Object.keys(V);
let cur = (new URLSearchParams(location.search).get('variant')||'').toUpperCase();
if (!V[cur]) cur = 'A';

function applyState(){
  // 变体 G：无 can_read_plain —— 明文档不可点（界面不摆必被拒的动作；服务端才是防线）
  const p = document.getElementById('expPlain');
  if (p) {
    p.disabled = cur === 'G';
    p.title = cur === 'G'
      ? '需要 can_read_plain 权限（仅全局管理持有）'
      : '明文档导出需 can_read_plain 权限，且整批记 EXPORT 审计';
  }
  // 变体 E/F：空态下工具栏的导出无意义，关掉（新建仍有意义，不关）
  const eb = document.getElementById('expBtn');
  if (eb) eb.disabled = (cur === 'E' || cur === 'F');
}

function render(){
  document.getElementById('root').innerHTML = V[cur].f();
  document.getElementById('lb').innerHTML = `<b>${cur}</b> <i>${V[cur].n}</i>`;
  const u = new URL(location.href); u.searchParams.set('variant', cur);
  history.replaceState(null,'',u);
  applyState();
}
function go(d){ const i = keys.indexOf(cur); cur = keys[(i+d+keys.length)%keys.length]; render(); }
document.getElementById('prev').onclick = () => go(-1);
document.getElementById('next').onclick = () => go(1);
addEventListener('keydown', e=>{
  const t=e.target, tag=t.tagName;
  if (tag==='INPUT'||tag==='TEXTAREA'||t.isContentEditable) return;
  if (e.key==='ArrowLeft'){e.preventDefault();go(-1);}
  if (e.key==='ArrowRight'){e.preventDefault();go(1);}
});
/* 导出菜单开关（原型只做开关，不接真实动作） */
document.addEventListener('click', e=>{
  const btn=e.target.closest('#expBtn'), m=document.getElementById('expMenu');
  if(!m) return;
  if(btn){ m.style.display = m.style.display==='block' ? 'none' : 'block'; return; }
  if(!e.target.closest('#expWrap')) m.style.display='none';
});
render();
</script>
</body>
</html>
