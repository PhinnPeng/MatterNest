<!--
  ════════════════════════════════════════════════════════════════════════════
  PROTOTYPE — 一次性产物，不进主干（prototype/p9-p18-2026-10-17 分支）。
  回答的问题是：「对手方档案详情这一页长什么样？」

  【对照的已交付实现】主仓 main 的 `src/app/(desk)/parties/[id]/party-detail.tsx`（MATT-40 / T3）。
  第一屏顺序照它摆：
    1. **本体**：名称 + 类型 + 证件号/手机号（**明文**，IQ-12：展示层全明文，
       没有「显示明文」按钮、也没有逐次审计）；
    2. **卷入的全部事项与案件及其中的地位**：两列并排给「我方地位 / 对方地位」——
       这才是「相对我方视角」；只给对方的地位，读者还得回头翻案件才知道我方是谁；
    3. **合并**（F3-9）：主记录显示「并入了哪几份」，被并方软删后接口给 404（名字不链过去）。
  内嵌两张表用平表（不是列表页那张 DataTable 壳）：一屏里不能再出第二个 h1。

  【本页承载的 F】F3-4 涉及案件/事项（总数按可见计；party_roles=对方在该案中的地位，
  相对我方视角）；F3-5 证件号/手机号展示层全明文（明文**导出**才需 can_read_plain）；
  F3-6 对手方标签；F3-7 删除（软删无回收站）；F3-8 加密存储；**F3-9 合并**。

  【变体】?variant= 或右下角浮条：
    A 默认详情      —— 有登记信息、两张关联表、无合并痕迹
    B 主记录（已合并） —— 页头带「并入了 N 份」；底部多一张「已并入本档案」卡
    C 合并弹窗 · 别的并进本档案（多选，F3-9 默认方向）
    D 合并弹窗 · 本档案并进别处（单选）+「合并不可撤销」紧挨提交键
    E 空关联        —— 两张表都空（落点①：各说下一步怎么挂上）

  ⚠ 文案纪律（`.trellis/spec/frontend/component-guidelines.md`「副标题纪律」+ AGENTS.md）：
    本文件不在 src/ 下，lint-guard 的源码断言扫不到它 —— 只剩立场能拦：
    · 标题下**没有**第二行说明；类型/证件号/时间回到「登记信息」字段表（落点④）；
    · 权限与"看不见的条数"落进 Alert / tooltip（落点①③），不在页头讲规则；
    · 合并的两条方向说明落进弹窗内（动作发生处），不在详情页首页讲。

  数据为内存假数据。色板抄自 src/app/theme/brand.ts，外壳照抄 AppShell。
  ════════════════════════════════════════════════════════════════════════════
-->

  const into = dir==='into';
  const picked = into
    ? [{id:'9002',name:'恒基建设集团有限公司南京分公司'},{id:'9006',name:'恒基建设（集团）有限公司'}]
    : [{id:'9004',name:'江苏恒基建设工程有限公司'}];
  const opts = MERGE_OPTIONS.filter(o=>!picked.find(p=>p.id===o.id));
  return `<div class="mask on">
    <div class="modal">
      <div class="modal-h">合并重复档案</div>
      <div class="modal-b">
        <div class="seg">
          <button class="${into?'on':''}">别的档案并进本档案</button>
          <button class="${into?'':'on'}">本档案并进别的档案</button>
        </div>
        <div class="fi">
          <input placeholder="按名称或完整证件号检索目标档案">
        </div>
        <div class="fi">
          <div class="sel">
            ${picked.length?picked.map(p=>`<span class="chipline">${esc(p.name)}<button class="x">×</button></span>`).join('')
              :`<span class="ph2">${into?'选择要并入的档案（可多选）':'选择要并入到哪一份档案'}</span>`}
          </div>
        </div>
        <div class="fi" style="margin-bottom:0">
          <textarea rows="2" maxlength="500" placeholder="说明（可选，记进审计）"></textarea>
        </div>
        <div class="alert warn" style="margin:12px 0 0">
          <span>⚠</span><div><b>合并不可撤销</b><br>
            被并方会被软删，它名下的案件与事项全部改挂到主记录；同一案卷上重复的那条关联会被丢掉。
            ${into?'主记录：恒基建设集团有限公司':'主记录：上面选中的那一份'}</div>
        </div>
      </div>
      <div class="modal-f">
        <button class="btn">取消</button>
        <button class="btn danger">合并</button>
      </div>
    </div>
  </div>`;
}

/* 检索命中提示（两个方向共用的那条"按名称/证件号找"的下一步） */
function mergeSearchNote(){
  return `<div class="card"><div class="pad" style="font-size:12.5px;color:var(--ink-3);line-height:1.8">
    目标是靠名称/完整证件号检索出来的，与列表、建案下拉同一个接口：一份下拉列不出全部档案，
    而"我要并的是哪一份"恰恰需要按证件号精确找。
  </div></div>`;
}

/* ══════════════ 变体 ══════════════ */
const V = {
  A:{n:'默认详情（有登记信息 + 两张关联表）',
     f:()=> pageHead()+regCard()+mattersCard()+risksCard()},
  B:{n:'主记录 · 已合并（页头 flag + 底部「已并入本档案」卡）',
     f:()=>{ P.mergedCount=2; const h=pageHead()+regCard()+mattersCard()+risksCard()+mergedCard(); P.mergedCount=0; return h; }},
  C:{n:'合并弹窗 · 别的并进本档案（多选，默认方向）',
     f:()=> pageHead()+regCard()+mattersCard()+risksCard()+mergeModal('into')+mergeSearchNote()},
  D:{n:'合并弹窗 · 本档案并进别处（单选）+ 不可撤销警告',
     f:()=> pageHead()+regCard()+mattersCard()+risksCard()+mergeModal('out')+mergeSearchNote()},
  E:{n:'空关联（两张表都空）',
     f:()=> pageHead()+regCard()+emptyMatters()+emptyRisks()},
};
const keys = Object.keys(V);
let cur = (new URLSearchParams(location.search).get('variant')||'').toUpperCase();
if (!V[cur]) cur = 'A';

function render(){
  document.getElementById('root').innerHTML = V[cur].f();
  document.getElementById('lb').innerHTML = `<b>${cur}</b> <i>${V[cur].n}</i>`;
  const u = new URL(location.href); u.searchParams.set('variant', cur);
  history.replaceState(null,'',u);
}
function go(d){ const i=keys.indexOf(cur); cur=keys[(i+d+keys.length)%keys.length]; render(); }
document.getElementById('prev').onclick=()=>go(-1);
document.getElementById('next').onclick=()=>go(1);
addEventListener('keydown', e=>{
  const t=e.target, tag=t.tagName;
  if (tag==='INPUT'||tag==='TEXTAREA'||t.isContentEditable) return;
  if (e.key==='ArrowLeft'){e.preventDefault();go(-1);}
  if (e.key==='ArrowRight'){e.preventDefault();go(1);}
});
render();
</script>
</body>
