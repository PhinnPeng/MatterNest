<title>原型 · 工作台「指标带 + 待办节点」布局（B 已选）</title>
<!--
  ══════════════════════════════════════════════════════════════════════
  PROTOTYPE v2 — 一次性产物，不进主干。
  回答的问题是：**工作台改成"通用数据指标 + 待办节点"之后长什么样，卡与卡怎么对齐**。

  【已裁定的方向】（2026-10-16 逐条对过）
   · 布局 = **B**：全整宽三段（指标带 → 待办节点 → 最近动作）；A / C 降级为对照
   · 指标带 **5 张**：在办案件 / 逾期节点 / 7 日内到期 / 事项 / 本月新增案件
     · 「在办案件」不带状态构成条 —— 状态机不属于总量指标（真页里那段已删，理由见文末）
   · 卡名用 **待办节点**（不用"重要事项"：GLOSSARY 里 `事项` 另有确切所指）
   · 页标题「今天该动手的」保留 16px
   · 最近动作整宽排两列、10 条全排（不截断、卡内不滚动）

  【对齐口径】卡与卡怎么算"对齐"，两层：
   · 第一行：指标卡同宽同高，**数字基线对齐**（卡内 space-between：标签在上、数字贴底）
   · 第二行以下的每张卡：底边收在同一条线上（栅格 align-items:stretch，不是各自撑高）

  【变体（右下浮条）】
   B 指标带 + 待办节点整宽 + 最近动作整宽（动作排两列）  ← **已选**
   A 指标带 + [待办节点 2/3 | 最近动作 1/3] 等高拉伸      ← 备选：左卡底部会留约 30px 空白
   C 现状（读数卡 2×2 + 最近动作 10 条，两栏 15/9）        ← 对照，不是提案

  【开关】栏宽（16+8 / 18+6，只对 A 有意义）· 标题 16/20 · 末行线 有/无 · 期限列 右对齐/跟随
  【状态（左下浮条）】正常 / 加载中（指标带五张 + 两张内容卡都是骨架）/ 空态① 节点干完 / 空态② 新库
    · 空态分两种，都是真会遇到的：① 活还在（在办案件 5、事项 14）而待办节点已清空；
      ② 什么都还没有。**指标带跟着状态走** —— 否则会出现"逾期节点 5"和"没有待办节点"同屏，
      而真页产生不出这个组合（`upcoming` 空 ⇒ 逾期必为 0；有 5 个逾期，待办节点就不可能为空）。

  ⚠ 文案纪律（.trellis/spec/frontend/component-guidelines.md「副标题纪律」）：
    本文件不在 src/ 下，lint-guard 的源码断言扫不到它 —— 只剩立场能拦：
    · 指标卡只有「标签 + 数字」（+ 事项卡的"已转 2"，它是同一个数的另一半，不是说明）
    · 没有一句"打开第一眼要回答的五个问题"式的旁白；口径类的话（归档不计入）留 tooltip
    · 空态说清下一步（落点①），照抄实现里的真文案

  数据：照本机 dev 实例实测抄的真值（2026-10-16）—— 在办案件 5（pending 1 · in_progress 3 · closed 1）·
  逾期节点 5 · 7 日内到期 0 · 事项 14（已转 2）· **本月新增案件 0**（5 条案件全部建在 2026-09，不是占位符）·
  最近动作 10 条（前 8 条真值，第 9、10 条按同形补）。色板抄自 src/app/theme/brand.ts。
  「本月新增」的口径 = 上海业务月：`created_at at time zone 'Asia/Shanghai' >= date_trunc('month', now() at time zone 'Asia/Shanghai')`
  —— 与 numbering.ts 的日界同款（服务器 TimeZone 是 UTC，直接比会差 8 小时）。**真页实现时服务层要补这个 count。**

  【已砍掉的一处】"在办案件"那张卡原先带一条状态构成条（1 已登记 / 3 进行中 / 1 已结案）：
  那段遍历 `meta.statuses`（字典里的全部状态，**含已归档**）去对 `overview.byStatus`，而 byStatus 是在
  `NOT is_archived` 上分组的 ⇒「已归档」那一行**结构上永远 0**，且百分比分母"在办案件"本就不含归档。
  这不是审美问题，是口径 bug —— 已从真页删掉。状态分布属于"案件列表 / 报表"，不属于这五张指标卡。
  ══════════════════════════════════════════════════════════════════════
-->

<script>
/* ── 数据：照本机 dev 实例抄的真值 ───────────────────────── */
const NODES = [
  { t:"仲裁开庭", code:"AJ-20260925-004", matter:"云脉数据科技与被申请人借款合同纠纷", at:"2026年9月28日 19:24", due:"逾期 18 天", tone:"bad" },
  { t:"开庭",     code:"AJ-20260921-001", matter:"恒基建设诉鼎泰房地产建设工程施工合同纠纷", at:"2026年9月29日 19:24", due:"逾期 17 天", tone:"bad" },
  { t:"二审开庭", code:"AJ-20260921-002", matter:"鼎泰房地产上诉建设工程施工合同纠纷二审", at:"2026年10月6日 19:24",  due:"逾期 10 天", tone:"bad" },
  { t:"举证",     code:"AJ-20260921-001", matter:"恒基建设诉鼎泰房地产建设工程施工合同纠纷", at:"2026年10月10日 19:24", due:"逾期 6 天",  tone:"bad" },
  { t:"举证",     code:"AJ-20260923-003", matter:"周敏诉南京云脉数据科技劳动争议", at:"2026年10月15日 19:24", due:"逾期 1 天",  tone:"bad" },
];
/* 指标卡：全部取自 overview 现在就给得出的数（matters.total / nodes.overdue / nodes.within7 / risks.total + converted）。
   第五张「本月新增案件」要服务层补一个 count（真页实现时加，口径见文件头注释）。
   注意：**不带状态分布** —— 已登记/进行中/已结案 是案件状态机里的三个数，不属于"在办案件"这个总量指标。 */
const METRICS = [
  { k:"在办案件", v:5, tip:"口径与列表一致：已归档不计入" },
  { k:"逾期节点", v:5, bad:true },
  { k:"7 日内到期", v:0 },
  { k:"事项", v:14, sub:"已转 2" },
  { k:"本月新增案件", v:0, tip:"按上海业务月算；同样已归档不计入" },
];

/* 指标带随状态走（空态那两种见文件头）：fresh = 品牌新库，全部归 0；
   empty = 节点干完了，只有"逾期 / 7 日内到期"归 0 —— 这两个数的口径就是"还没完成的节点"。 */
function metricsOf(state) {
  if (state === "fresh") return METRICS.map((m) => ({ k: m.k, v: 0, tip: m.tip }));
  if (state === "empty")
    return METRICS.map((m) =>
      m.k === "逾期节点" || m.k === "7 日内到期" ? { ...m, v: 0, bad: false } : m);
  return METRICS;
}
const ACTS = [
  ["新建进展","AJ-20260925-004","4 天前"],["新建事项","FX-20261012-102","4 天前"],
  ["发表评论","AJ-20260921-001","8 天前"],["新建事项","FX-20260922-001","9 天前"],
  ["修改节点","AJ-20260921-001","9 天前"],["状态变更","AJ-20260921-001","10 天前"],
  ["新建案件","AJ-20260921-001","10 天前"],["转为案件","AJ-20260921-002","10 天前"],
  ["归档","AJ-20260910-006","11 天前"],["状态变更","AJ-20260922-001","11 天前"],
];
const CAP_A = 6;   // 变体 A：动作排到与左卡齐平
const CAP_C = 10;  // 变体 C：现状全排

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

let variant = "B", state = "ok";
const q = new URLSearchParams(location.search);
(() => { const v = (q.get("variant") || "").toUpperCase(); if (v && "ABC".includes(v)) variant = v; })();
if (["ok","loading","empty","fresh"].includes(q.get("state"))) state = q.get("state");

const Skel = (n, lastHalf) =>
  Array.from({length:n}, (_,i) => `<div class="sk${lastHalf && i===n-1 ? " w60" : ""}"></div>`).join("");

const kpiBand = () => {
  if (state === "loading") {
    return `<div class="metrics">${Array.from({length:5}, () => `
      <div class="kpi"><div class="sk" style="margin:0;width:52%"></div>
        <div class="sk" style="margin:0;width:38%;height:22px"></div></div>`).join("")}</div>`;
  }
  return `<div class="metrics">${metricsOf(state).map((m) => `
    <div class="kpi">
      <div class="k">${m.k}${m.tip ? `<span class="i" title="${esc(m.tip)}">i</span>` : ""}</div>
      <div class="v${m.bad ? " bad" : ""}">${m.v}${m.sub ? `<small>${m.sub}</small>` : ""}</div>
    </div>`).join("")}</div>`;
};

const nodeRow = (n) => variant === "B"
  ? `<div class="r">
       <i class="band ${n.tone}"></i>
       <div class="nm"><a href="#">${esc(n.t)}</a></div>
       <div class="code">${esc(n.code)}</div>
       <div class="host">${esc(n.matter)}</div>
       <div class="due ${n.tone}">${n.due}</div>
     </div>`
  : `<div class="r">
       <i class="band ${n.tone}"></i>
       <div class="stack">
         <div class="title"><a href="#">${esc(n.t)}</a></div>
         <div class="meta">${document.body.dataset.due === "inline"
           ? `${esc(n.code)} · ${esc(n.matter)}` : `${esc(n.code)} · ${esc(n.matter)} · ${esc(n.at)}`}</div>
       </div>
       <div class="due ${n.tone}">${document.body.dataset.due === "inline" ? "" : n.due}</div>
     </div>`;

function mattersCard() {
  const body = state === "loading" ? Skel(4, true)
    : state === "empty" ? `<div class="empty"><b>没有待办节点</b>
        <p>所有已确认时间的节点都完成了。新建节点在案件详情页的「工作节点」里。</p>
        <button class="btn p sm">去案件列表</button></div>`
    : state === "fresh" ? `<div class="empty"><b>还没有案件</b>
        <p>先建第一个案件，再在案件详情页的「工作节点」里加节点。</p>
        <button class="btn p sm">去案件列表</button></div>`
    : NODES.map(nodeRow).join("");
  // 卡名 = 待办节点；变体 C 是对照，仍用现状那个名字（节点到期）
  const title = variant === "C" ? "节点到期" : "待办节点";
  return `<section class="card">
    <div class="card-h"><b>${title}</b>
      <span class="x">含已逾期，按期限升序</span></div>
    ${body}
  </section>`;
}

function actsCard() {
  if (state === "loading") return `<section class="card"><div class="card-h"><b>最近动作</b></div>${Skel(4, true)}</section>`;
  if (state === "fresh") return `<section class="card"><div class="card-h"><b>最近动作</b></div>
    <div class="empty"><b>还没有活动记录</b><p>建案、改状态、加评论都会记在这里。</p></div></section>`;
  const cap = variant === "A" ? CAP_A : CAP_C; // B 整宽排两列，10 条只占 5 行
  const shown = ACTS.slice(0, cap);
  const chip = cap < ACTS.length ? `${shown.length} / ${ACTS.length}` : `${shown.length}`;
  const rows = shown.map((a) => `<div class="act">
      <div class="l1"><span class="tag">${esc(a[0])}</span><a class="code" href="#">${esc(a[1])}</a></div>
      <div class="l2">系统管理员 · ${esc(a[2])}</div></div>`).join("");
  const body = variant === "A" ? `<div class="grow">${rows}</div>`
    : variant === "B" ? `<div class="acts2">${rows}</div>` : rows;
  return `<section class="card">
    <div class="card-h"><b>最近动作</b><span class="cnt">${chip}</span></div>${body}</section>`;
}

function render() {
  document.body.dataset.variant = variant;
  const col2 = variant === "C"
    ? `${readoutCardC()}${actsCard()}`
    : actsCard();
  document.getElementById("content").innerHTML = `
    <div class="pagehead"><h1>今天该动手的</h1><button class="btn">↻ 刷新</button></div>
    ${variant === "C" ? "" : kpiBand()}
    <div class="wb">${mattersCard()}<div class="col">${col2}</div></div>`;
}

/* 变体 C 的"范围读数"卡：搬现状那一张（2×2 读数、**无状态条**），只为对照 */
function readoutCardC() {
  if (state === "loading") return `<section class="card"><div class="card-h"><b>范围读数</b></div>${Skel(4, true)}</section>`;
  return `<section class="card">
    <div class="card-h"><b>范围读数</b></div>
    <div style="padding:14px 16px 16px">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px 8px">
        ${metricsOf(state).slice(0, 4).map((m) => `<div><div style="font-size:14px;color:var(--ink-2)">${m.k}</div>
          <div style="font-size:20px;font-weight:600${m.bad ? ";color:var(--overdue)" : ""}">${m.v}${
            m.sub ? `<small style="font-size:11.5px;font-weight:400;color:var(--ink-3);margin-left:4px">${m.sub}</small>` : ""}</div></div>`).join("")}
      </div>
    </div>
  </section>`;
}

function sync() {
  for (const b of document.querySelectorAll("#switcher button")) {
    const k = Object.keys(b.dataset)[0];
    b.classList.toggle("on", b.dataset[k] === document.body.dataset[k]);
  }
  for (const b of document.querySelectorAll("#playbar button")) b.classList.toggle("on", b.dataset.state === state);
}

document.getElementById("switcher").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  const k = Object.keys(b.dataset)[0];
  if (k === "variant") variant = b.dataset.variant;
  else document.body.dataset[k] = b.dataset[k];
  const p = new URLSearchParams(location.search);
  if (k === "variant") p.set("variant", variant);
  history.replaceState(null, "", "?" + p.toString());
  render(); sync();
});
document.getElementById("playbar").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-state]"); if (!b) return;
  state = b.dataset.state;
  history.replaceState(null, "", "?variant=" + variant + "&state=" + state);
  render(); sync();
});

render(); sync();
</script>
</body>
</html>
