<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>原型 · P11 状态配置</title>
<!--
  ════════════════════════════════════════════════════════════════════════════
  PROTOTYPE — 一次性产物，不进主干（prototype/p9-p18-2026-10-17 分支）。
  回答的问题是：「状态配置这一页长什么样？」

  【页面编号 / 路由】PRD §4.4 的 **P11**，路由 `/settings/status-config`，
  菜单路径「系统设置 > 配置页组 > 状态配置」。IQ-9 Q38 用户亲拍：**每类独立功能页，
  不合并字典页**（原「后台单页 / 多 Tab」口径作废）。

  【本页承载的 F】（PRD §4.2 M5 + §4.5）
    F5-1 状态配置：新建仅 `custom`、改名改色排序、**code 不可改**
         （显示名 seed 按 IQ-5/6：双宿主 `pending`=已登记、事项 `closed`=已处理、
          案件 `closed`=已结案；`code` 与 semantics 全部不变，改的只是 name）；
    F5-2 状态停用（**被启用规则引用则阻止**）；
    写需 `can_manage_config`，读全体登录可用（权限草案 §2.1 v5）。

  【形态依据】`src/app/lib/server/db/schema/status-config.ts` 的列 + seed `0000_mn_status_config.sql`
  （八行 = 4 语义 × 2 宿主）。表上的条件唯一索引（每宿主恰好 1 个初始态 / 1 个归档态 /
  至多 1 个结案态）是这一页里几处禁用态的理由，不是随手加的限制。

  【变体 = 这一页真会遇到的几种态】?variant= 或右下角浮条：
    A 案件宿主（默认）—— 4 行 seed + 2 行自建状态
    B 事项宿主        —— 同壳换行；显示名分叉（已处理 vs 已结案）是刻意的
    C 新建状态        —— semantics 锁死 custom，code 一次性
    D 停用被引用       —— F5-2：被启用规则引用 → 阻止，并指出去哪解引用
    E 编辑内置状态     —— 只能改名/改色/排序；code 与 semantics 只读

  【一个刻意的形态决定】宿主切换放在**表格卡内**、与表级动作同一行，不放页头。
  理由是两套状态集是同一页的两种"视图"，不是两个页面；页头留给页面本身。

  ⚠ 文案纪律（`.trellis/spec/frontend/component-guidelines.md`「副标题纪律」+ AGENTS.md）：
    本文件不在 src/ 下，lint-guard 的源码断言扫不到它 —— 只剩立场能拦：
    · 标题下**没有**第二行说明（"状态驱动系统行为"这种就是讲规则）；
    · semantics 的取值与"为什么内置不可删"落进**折叠字段表**（落点④）与 tooltip（落点③）；
    · 被引用阻止的说明落进**错误态**（落点①）并指出下一步；
    · code 不可改落进控件的 disabled + tooltip（动作发生处）。

  数据为内存假数据。色板抄自 src/app/theme/brand.ts，外壳照抄 AppShell。
  ════════════════════════════════════════════════════════════════════════════
-->
<style>
  :root{
    --brand:#2f5fe0; --brand-hover:#4473f0;
    --success:#1a9c6b; --overdue:#c2363b; --soon:#9a5a00;
    --sider-bg:#1d2433; --sider-item:#c3ccdd;
    --paper:#f7f8fa;
    --ink:#1d2433; --ink-2:#4f5a6f; --ink-3:#616a79; --ink-4:#a4abb8;
    --line:#eceef3; --line-2:#dfe3ec; --rail:#c8ccd4;
    --r:8px; --shadow:0 1px 2px rgba(29,36,51,.06),0 1px 3px rgba(29,36,51,.04);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font:14px/1.55 -apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
  button{font:inherit;cursor:pointer}
  .num{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

  .shell{display:flex;min-height:100vh}
  .sider{width:216px;flex:none;background:var(--sider-bg);color:var(--sider-item);
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .sider-brand{padding:14px 16px 10px}
  .sider-brand b{display:block;color:#fff;font-size:15px}
  .nav{padding:4px 8px;flex:1;overflow:auto}
  .nav-group{font-size:11px;color:#6f7a90;padding:12px 8px 5px;letter-spacing:.5px}
  .nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:6px;
    color:var(--sider-item);font-size:13.5px;margin:1px 0}
  .nav-item.on{background:var(--brand);color:#fff;font-weight:500}
  .nav-item.sub{padding-left:30px;font-size:13px}
  .nav-item .ic{width:16px;text-align:center;opacity:.88}
  .sider-foot{padding:10px 16px;border-top:1px solid rgba(255,255,255,.08);
    display:flex;align-items:center;gap:9px;justify-content:center}
  .sider-foot b{display:block;color:#fff;font-size:13px}
  .avatar{width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;
    display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{height:60px;background:#fff;border-bottom:1px solid var(--line);
    display:flex;align-items:center;padding:0 24px;position:sticky;top:0;z-index:20}
  .topbar h1{font-size:15px;margin:0;font-weight:500}
  .crumb{font-size:12px;color:var(--ink-3);margin-left:10px}
  .content{padding:16px 24px 96px;flex:1;max-width:1180px;margin:0 auto;width:100%}

  .card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .pad{padding:16px 20px}
  .row{display:flex;gap:10px;align-items:center}
  .between{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .lbl{font-size:12px;color:var(--ink-3)} .muted{color:var(--ink-3)} .faint{color:var(--ink-4)}
  .tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 9px;border-radius:20px;
    background:#eef1f6;color:var(--ink-2);white-space:nowrap}
  .tag.ok{background:#e9f7f1;color:var(--success)}
  .tag.warn{background:#fff4e6;color:var(--soon)}
  .tag.bad{background:#fdecec;color:var(--overdue)}
  .btn{border:1px solid var(--rail);background:#fff;border-radius:6px;padding:6px 13px;color:var(--ink-2);font-size:13px}
  .btn:hover{border-color:var(--brand);color:var(--brand)}
  .btn.p{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:500}
  .btn.p:hover{background:var(--brand-hover);color:#fff}
  .btn.sm{padding:3px 9px;font-size:12px}
  .btn[disabled]{opacity:.45;cursor:not-allowed;border-color:var(--rail);color:var(--ink-3)}

  /* 页头 */
  .ph{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:12px;flex-wrap:wrap}
  .ph h1{font-size:16px;margin:0;font-weight:600;line-height:28px}

  /* 宿主切换（放表格卡内、与表级动作同一行） */
  .seg{display:inline-flex;border:1px solid var(--rail);border-radius:6px;overflow:hidden}
  .seg button{border:0;background:#fff;padding:5px 13px;font-size:12.5px;color:var(--ink-2);border-right:1px solid var(--rail)}
  .seg button:last-child{border-right:0}
  .seg button.on{background:#eaf0fd;color:var(--brand);font-weight:600}

  .tb-head{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;
    align-items:center;gap:12px;flex-wrap:wrap}
  .tb-head h1{font-size:15px;margin:0;font-weight:600}

  table{width:100%;border-collapse:collapse;table-layout:fixed}
  th{background:#f7f8fa;color:var(--ink-2);font-weight:500;font-size:12px;text-align:left;
    padding:9px 12px;border-bottom:1px solid var(--line-2);white-space:nowrap}
  td{padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
  tr:last-child td{border-bottom:0}
  tr.body:hover{background:#fbfcfe}
  td.code{font-size:12.5px;color:var(--ink-2)}
  td.code .lock{color:var(--ink-4);font-size:11px;margin-left:5px}
  .sw-dot{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:7px;vertical-align:-1px;
    border:1px solid rgba(29,36,51,.12)}
  .flag{font-size:11px;padding:1px 7px;border-radius:3px;background:#eef1f6;color:var(--ink-2);white-space:nowrap;margin-right:4px}
  .flag.init{background:#eaf0fd;color:var(--brand)}
  .flag.arch{background:#f1f2f5;color:var(--ink-2)}
  .flag.sys{background:#f6f0ff;color:#6b3fa8}
  .flag.custom{background:#e9f7f1;color:var(--success)}
  .tgl{display:inline-flex;align-items:center;gap:6px;font-size:12.5px}
  .tgl i{width:30px;height:17px;border-radius:9px;background:var(--brand);position:relative;display:inline-block}
  .tgl i::after{content:"";position:absolute;top:2px;right:2px;width:13px;height:13px;border-radius:50%;background:#fff}
  .tgl.off i{background:var(--rail)}
  .tgl.off i::after{left:2px;right:auto}
  .acts{display:flex;gap:12px;color:var(--ink-3);font-size:12px}
  .acts span:hover{color:var(--brand);cursor:pointer}
  .acts span[aria-disabled=muted]{color:var(--ink-4)}
  .acts span[aria-disabled=muted]:hover{color:var(--ink-4);cursor:not-allowed}

  .alert{display:flex;gap:9px;padding:10px 13px;border-radius:6px;font-size:12.5px;line-height:1.7;margin-bottom:12px}
  .alert.info{background:#f0f5ff;color:#2a4a9c;border:1px solid #cfdcfb}
  .alert.warn{background:#fff8ec;color:#7a4a00;border:1px solid #f2ddb5}
  .alert.bad{background:#fdecec;color:#8f2a2e;border:1px solid #f5cdcd}
  .alert b{font-weight:600}

  /* 折叠字段表（落点④） */
  details.fld{border:1px solid var(--line);border-radius:8px;background:#fbfcfe;margin-top:14px}
  details.fld summary{cursor:pointer;font-size:12.5px;color:var(--brand);padding:10px 14px;list-style:none;user-select:none}
  details.fld summary::before{content:"▸ ";display:inline-block;transition:transform .15s}
  details.fld[open] summary::before{content:"▾ "}
  details.fld .body{padding:2px 14px 14px;font-size:12.5px;color:var(--ink-2);line-height:1.85}
  details.fld .body b{color:var(--ink)}
  details.fld .code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--ink-3)}

  /* 弹窗 */
  .mask{position:fixed;inset:0;background:rgba(29,36,51,.38);display:none;align-items:flex-start;
    justify-content:center;z-index:80;padding:56px 20px;overflow:auto}
  .mask.on{display:flex}
  .modal{width:520px;max-width:100%;background:#fff;border-radius:10px;box-shadow:0 16px 48px rgba(29,36,51,.24)}
  .modal-h{padding:16px 20px;border-bottom:1px solid var(--line);font-size:15px;font-weight:600}
  .modal-b{padding:16px 20px}
  .modal-f{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
  .fi{margin-bottom:14px}
  .fi-l{display:block;font-size:12.5px;color:var(--ink-2);margin-bottom:5px;font-weight:500}
  .fi-l .req{color:var(--overdue);margin-right:3px;font-weight:700}
  .fi input,.fi select{width:100%;border:1px solid var(--rail);border-radius:6px;padding:7px 11px;
    font:inherit;font-size:13.5px;color:var(--ink);background:#fff;height:36px}
  .fi input[readonly]{background:#f6f7f9;color:var(--ink-2);cursor:default}
  .fi input:focus,.fi select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(47,95,224,.12)}
  .fi-x{font-size:11.5px;color:var(--ink-3);margin-top:5px;line-height:1.6}
  .colors{display:flex;gap:8px;flex-wrap:wrap}
  .colors button{width:26px;height:26px;border-radius:6px;border:2px solid transparent}
  .colors button.on{border-color:var(--ink);box-shadow:0 0 0 2px #fff inset}

  .sw{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:99;
    display:flex;align-items:center;gap:4px;background:var(--ink);color:#fff;
    border-radius:22px;padding:5px 8px;box-shadow:0 6px 22px rgba(29,36,51,.28);max-width:92vw;flex-wrap:wrap}
  .sw button{background:none;border:0;color:#fff;width:26px;height:26px;border-radius:50%;font-size:15px;line-height:1}
  .sw button:hover{background:rgba(255,255,255,.16)}
  .sw .lb{font-size:12.5px;padding:0 10px;white-space:nowrap}
  .sw .lb b{font-weight:600}
  .sw .lb i{font-style:normal;color:#aeb6c6;margin-left:6px}
  .sw .warn{font-size:11px;color:#ffb4b4;padding:0 8px;border-left:1px solid rgba(255,255,255,.2);margin-left:4px}
</style>
</head>
<body>

<div class="shell">
  <aside class="sider">
    <div class="sider-brand"><b>MatterNest</b></div>
    <nav class="nav">
      <div class="nav-group">概要</div>
      <div class="nav-item"><span class="ic">◷</span>工作台</div>
      <div class="nav-item"><span class="ic">◔</span>通知</div>
      <div class="nav-group">业务</div>
      <div class="nav-item"><span class="ic">▤</span>案件</div>
      <div class="nav-item"><span class="ic">◇</span>事项</div>
      <div class="nav-item"><span class="ic">▣</span>当事人</div>
      <div class="nav-item"><span class="ic">◫</span>已归档</div>
      <div class="nav-group">系统</div>
      <div class="nav-item"><span class="ic">⚙</span>配置</div>
      <div class="nav-item sub on">状态配置</div>
      <div class="nav-item sub">节点类型配置</div>
      <div class="nav-item sub">费用项目配置</div>
      <div class="nav-item sub">风险等级配置</div>
      <div class="nav-item sub">标签配置</div>
      <div class="nav-item"><span class="ic">◈</span>用户与角色</div>
    </nav>
    <div class="sider-foot"><div class="avatar">沈</div><b>沈亦</b></div>
  </aside>

  <div class="main">
    <header class="topbar"><h1>状态配置<span class="crumb">系统设置 / 配置 / 状态配置</span></h1></header>
    <div class="content" id="root"></div>
  </div>
</div>

<div class="sw">
  <button id="prev" title="上一个（←）">‹</button>
  <div class="lb" id="lb"></div>
  <button id="next" title="下一个（→）">›</button>
  <span class="warn">原型</span>
</div>

<script>
/* ══════════════ 假数据（照 seed 八行 + 两行自建） ══════════════ */
const M = {           // matter（案件）
  label:'案件',
  rows:[
    {code:'pending',     name:'已登记', sem:'open',         sys:true,  init:true,  arch:false, on:true,  sort:1, color:'slate'},
    {code:'in_progress', name:'进行中', sem:'in_progress',  sys:true,  init:false, arch:false, on:true,  sort:2, color:'blue'},
    {code:'mediation',   name:'调解中', sem:'custom',       sys:false, init:false, arch:false, on:true,  sort:3, color:'amber'},
    {code:'closed',      name:'已结案', sem:'closed',       sys:true,  init:false, arch:false, on:true,  sort:4, color:'green'},
    {code:'suspended',   name:'中止',   sem:'custom',       sys:false, init:false, arch:false, on:false, sort:5, color:'violet'},
    {code:'archived',    name:'已归档', sem:'archived',     sys:true,  init:false, arch:true,  on:true,  sort:6, color:'gray'},
  ],
};
const R = {           // risk_matter（事项）
  label:'事项',
  rows:[
    {code:'pending',     name:'已登记', sem:'open',        sys:true, init:true,  arch:false, on:true, sort:1, color:'slate'},
    {code:'in_progress', name:'进行中', sem:'in_progress', sys:true, init:false, arch:false, on:true, sort:2, color:'blue'},
    {code:'closed',      name:'已处理', sem:'closed',      sys:true, init:false, arch:false, on:true, sort:3, color:'green'},
    {code:'archived',    name:'已归档', sem:'archived',    sys:true, init:false, arch:true,  on:true, sort:4, color:'gray'},
  ],
};
const COLOR_HEX = {slate:'#8a93a5', blue:'#2f5fe0', amber:'#c99400', green:'#1a9c6b', violet:'#7a52c9', gray:'#b6bcc7'};
const SEM_LABEL = {open:'初始态', in_progress:'计入活跃', closed:'视为结案', archived:'触发归档', custom:'无系统行为'};

const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ══════════════ 片段 ══════════════ */
function pageHead(){
  return `<div class="ph">
    <h1>状态配置</h1>
    <div class="row" style="flex:none">
      <button class="btn p" id="newBtn">＋ 新建状态</button>
    </div>
  </div>`;
}

function hostTable(host){
  const d = host==='matter' ? M : R;
  return `<div class="card">
    <div class="tb-head">
      <div class="row" style="gap:12px">
        <div class="seg">
          <button class="${host==='matter'?'on':''}">案件</button>
          <button class="${host==='risk_matter'?'on':''}">事项</button>
        </div>
        <span class="lbl">${d.rows.length} 个状态</span>
      </div>
      <div class="row">
        <button class="btn sm">刷新</button>
      </div>
    </div>
    <table>
      <thead><tr>
        <th style="width:150px">编码</th>
        <th style="width:150px">显示名</th>
        <th style="width:120px">语义</th>
        <th style="width:120px">标记</th>
        <th style="width:80px">排序</th>
        <th style="width:110px">启用</th>
        <th style="width:150px">操作</th>
      </tr></thead>
      <tbody>${d.rows.map(r=>rowHtml(host,r)).join('')}</tbody>
    </table>
    <div class="pad" style="padding-top:0;border-top:1px solid var(--line)">
      ${semanticsFold()}
    </div>
  </div>`;
}

function rowHtml(host,r){
  const flags = [
    r.sys ? `<span class="flag sys">内置</span>` : `<span class="flag custom">自建</span>`,
    r.init ? `<span class="flag init" title="新建宿主时落在这个状态；每宿主恰好一个">初始态</span>` : '',
    r.arch ? `<span class="flag arch" title="触发归档：只读 + 列表默认隐藏；每宿主恰好一个">归档态</span>` : '',
  ].join('');
  const codeHint = r.sys
    ? '内置状态的 code 被 seed 与规则引用，创建后不可改'
    : 'code 创建后不可改——规则与接口引用它，不引用显示名';
  return `<tr class="body">
    <td class="code" title="${codeHint}"><span class="num">${esc(r.code)}</span><span class="lock" title="${codeHint}">🔒</span></td>
    <td><span class="sw-dot" style="background:${COLOR_HEX[r.color]||'#8a93a5'}"></span>${esc(r.name)}</td>
    <td><span class="tag">${esc(SEM_LABEL[r.sem]||r.sem)}</span>
      <span class="faint num" style="font-size:11px;display:block;margin-top:2px">${esc(r.sem)}</span></td>
    <td>${flags}</td>
    <td><span class="num">${r.sort}</span></td>
    <td>${r.on
      ? `<span class="tgl"><i></i>启用</span>`
      : `<span class="tgl off"><i></i>停用</span>`}</td>
    <td><div class="acts">
      <span>改名</span><span>改色</span><span>排序</span><span>${r.on?'停用':'启用'}</span>
      <span ${r.sys?'aria-disabled="muted" title="内置状态不可删——可改名/改色/排序，改 code 不可"':''}>删除</span>
    </div></td>
  </tr>`;
}

function semanticsFold(){
  return `<details class="fld">
    <summary>语义取值与三处唯一约束（决定系统行为，不是装饰）</summary>
    <div class="body">
      ${Object.entries(SEM_LABEL).map(([k,v])=>`<div><b>${v}</b>　<span class="code">${k}</span>${
        k==='custom'?'　—— 新建状态只能选它；四个内置语义由 seed 持有、不可授予':''
      }</div>`).join('')}
      <div style="margin-top:8px">
        · 每宿主<b>恰好一个</b>初始态（新建宿主时落到它）；
        · 每宿主<b>恰好一个</b>归档态（触发只读 + 列表默认隐藏）；
        · 每宿主<b>至多一个</b>结案态（写入结案日期）。
        这三条由条件唯一索引守住，所以「新建状态」里没有它们的选项。
      </div>
      <div style="margin-top:8px">
        停用一个状态只影响"还能不能被选"：历史数据仍指着它，列表与详情照常显示。
      </div>
    </div>
  </details>`;
}

function newModal(){
  return `<div class="mask on">
    <div class="modal">
      <div class="modal-h">新建状态 · ${M.label}</div>
      <div class="modal-b">
        <div class="fi">

const DISABLE_BLOCKED = `<div class="alert bad">
  <span>⚠</span><div><b>「进行中」正被 2 条启用规则引用，不能停用</b><br>
    规则 3「案件进入进行中→创建节点」与规则 4「长期未更新提醒」的触发条件里带这个状态。
    先到「自动化规则」把这两条停用或改条件，再回来停用它。</div>
</div>`;

/* ══════════════ 变体 ══════════════ */
const V = {
  A:{n:'案件宿主（默认，含 2 行自建）', f:()=> pageHead()+hostTable('matter')},
  B:{n:'事项宿主（显示名分叉：已处理 / 已结案）', f:()=> pageHead()+hostTable('risk_matter')},
  C:{n:'新建状态（semantics 锁死 custom）', f:()=> pageHead()+hostTable('matter')+newModal()},
  D:{n:'停用被启用规则引用 → 阻止（F5-2）', f:()=> pageHead()+DISABLE_BLOCKED+hostTable('matter')},
  E:{n:'编辑内置状态（code 与语义只读）', f:()=> pageHead()+hostTable('matter')+editModal()},
};
const keys = Object.keys(V);
let cur = (new URLSearchParams(location.search).get('variant')||'').toUpperCase();
if (!V[cur]) cur='A';

function render(){
  document.getElementById('root').innerHTML = V[cur].f();
  document.getElementById('lb').innerHTML = `<b>${cur}</b> <i>${V[cur].n}</i>`;
  const u = new URL(location.href); u.searchParams.set('variant', cur);
  history.replaceState(null,'',u);
}
function go(d){ const i=keys.indexOf(cur); cur=keys[(i+d+keys.length)%keys.length]; render(); }
document.getElementById('prev').onclick=()=>go(-1);
document.getElementById('next').onclick=()=>go(1);
addEventListener('keydown', e=>{
  const t=e.target, tag=t.tagName;
  if (tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||t.isContentEditable) return;
  if (e.key==='ArrowLeft'){e.preventDefault();go(-1);}
  if (e.key==='ArrowRight'){e.preventDefault();go(1);}
});
render();
</script>
</body>
