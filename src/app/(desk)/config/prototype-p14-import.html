<!--
  ══════════════════════════════════════════════════════════════════════
  PROTOTYPE — 一次性产物，不进主干。回答的问题是：**批量导入这一页长什么样**。
  （IQ-11：P14 是唯一被明文要求「必须出原型」的页面；上游 PRD F7-4 / M7 US-M7-1）

  【三个变体只差一件事：结果怎么摆】
  A 单栏流式：选模板 → 上传 → 结果在下方原地展开（一张纸从头读到尾）
  B 左右两栏：左模板右上传；导入后结果**替换**上传区（不滚动找结果）
  C 结果独占一屏：上传区塌成顶部一条细 bar（文件名 + 三计数），主视觉交给未导入的行

  变体切换：右下角浮条，或地址栏 ?variant=A|B|C
  状态切换：左下角一排按钮 —— 正常 / 全部成功 / 同文件重导 / 文件级错误 / 非 L1 拒绝
  （数量、原因码、中文原因都照实现里的真文案写，不是"待补充"）

  ⚠ 文案纪律（.trellis/spec/frontend/component-guidelines.md「副标题纪律」）：
    本文件不在 src/ 下，lint-guard 的源码断言扫不到它 —— 只剩立场能拦，所以逐句过了：
    · 标题下**没有**第二行说明（"上传 Excel 把历史台账一次性迁入"这种就是复述 + 讲规则）
    · 取值与字段落进**折叠区的字段表**（落点④），不在页头讲规则
    · 空态/错误态说清下一步（落点①）；上传控件说明走 placeholder（落点②）
    · 行号/字段/原因这类解释走 tooltip（落点③）

  数据为内存假数据。色板抄自 src/app/theme/brand.ts，外壳照抄 AppShell。
  ══════════════════════════════════════════════════════════════════════
-->
<style>

  .shell{display:flex;min-height:100vh}

  .code{font-size:11px;color:var(--ink-4);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;margin-left:6px}

  .playbar span{font-size:11.5px;color:var(--ink-3)}

  /* 变体 A：单栏流式 */
  .vA .stack{display:flex;flex-direction:column;gap:14px;max-width:980px}
  /* 变体 B：左右两栏，结果替换上传区 */
  .vB .grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
  .vB .side{position:sticky;top:76px}
  /* 变体 C：上传塌成细 bar，结果独占一屏 */

    background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .vC .topline .nm{font-size:13px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .vC .mini{display:flex;gap:16px;font-size:12.5px;color:var(--ink-2);margin-left:auto}
  .vC .mini b{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
</style>

<script>
/* ── 原型数据（照实现里的真文案写，不是"待补充"） ───────────────────────── */
const TPL = {
  risk_matter: {
    name: "风险事项", file: "风险事项导入模板.csv",

/* 一次"三年台账"的量级：853 行、812 进库、41 未进库（含 12 个各不相同的行） */

  [4, "整行", "duplicate_row", "与本文件第 3 行的内容完全相同，未重复导入（若这是两笔真事，请在其中一行加上可区分的信息）"],

  [31, "整行", "already_imported", "与第 12 行（批次 103381586115825664）内容相同，已导入过，未重复导入"],
];
const ICON = {duplicate_row:"duplicate_row", unknown_enum:"unknown_enum", unknown_config:"unknown_config", required:"required",
  unknown_user:"unknown_user", invalid_field:"invalid_field", party_mismatch:"party_mismatch", own_company:"own_company",

const STATE = {
  ok:      {state:"done", total:853, imported:812, error:41, replayed:false, rows:BASE_ROWS,
            note:["warn","41 行没有导入。","下面是最前面的 12 条，完整清单在错误报告里。"]},
  all:     {state:"done", total:853, imported:853, error:0, replayed:false, rows:[],
            note:["info","853 行全部导入。",""]},
  replay:  {state:"done", total:853, imported:0, error:853, replayed:true,
            /* 重导的真实形态**不是清一色 already_imported**：好行按内容命中，

            rows:[
              [4, "整行", "already_imported", "与第 3 行（批次 103381586115825664）内容相同，已导入过，未重复导入"],
              [6, "风险类型", "unknown_enum", "「风险类型」不认识「非诉」。取值：合同/劳动争议/知识产权/公司治理/债权债务/合规/诉讼衍生/其他（可填中文名或英文码）"],
              [7, "整行", "already_imported", "与第 5 行（批次 103381586115825664）内容相同，已导入过，未重复导入"],
              [13, "整行", "already_imported", "与第 9 行（批次 103381586115825664）内容相同，已导入过，未重复导入"],
            ],
            note:["info","这一份文件之前导过，本次一行都没有新增。","已经导入的 850 行按内容命中被跳过；报告里逐行列了它们对应的旧行号，坏行照旧报它原来的原因。"]},
  fileerr: {state:"fileerr", total:0, imported:0, error:0, replayed:false, rows:[],
            note:["bad","表头里有本模板不认识的列：备注。","请下载对应模板后在其表头上填写（多出来的列请删掉——留着会被当成已导入，实际没有）。"]},
  denied:  {state:"denied", total:0, imported:0, error:0, replayed:false, rows:[],
            note:["bad","批量导入只对持有全局数据范围的角色（全局管理 / 全局经办）开放，当前角色不具备。",""]},
};

let variant = (new URLSearchParams(location.search).get("variant") || "A").toUpperCase();
if (!"ABC".includes(variant)) variant = "A";
let playState = "ok";
let tplKind = "risk_matter";
let pickedFile = {name:"2024-2026历史台账-事项.csv", size:"268 KB", rows:853};

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function fieldsBlock(kind){
  const t = TPL[kind];
  return `<details class="fields-wrap">
    <summary>字段与取值（${esc(t.name)}模板 · ${t.cols.length} 列）</summary>
    <div class="fields">
      ${t.cols.map(([n,req,h]) => `<div class="fld"><b>${esc(n)}${req?'<i>*</i>':''}</b><span>${esc(h||"—")}</span></div>`).join("")}
    </div>
  </details>`;
}

/** 上传区（A/B/C 三处共用；C 在导入完成后塌成细 bar） */
function uploadCard(collapsed){
  if (collapsed){
    const s = STATE[playState];
    return `<div class="topline">
      <span class="ico" style="width:26px;height:26px;border-radius:6px;background:#eaf0fd;color:var(--brand);display:grid;place-items:center;font-size:10.5px;font-weight:700">CSV</span>
      <span class="nm">${esc(pickedFile.name)}</span>
      <span class="tag">${esc(TPL[tplKind].name)}模板</span>
      <span class="mini">
        <span>共 <b>${s.total}</b> 行</span>
        <span>进库 <b style="color:var(--success)">${s.imported}</b></span>
        <span>未进 <b style="color:var(--overdue)">${s.error}</b></span>
      </span>
      <button class="btn sm" data-act="reset">换一份文件</button>
    </div>`;
  }
  return `<section class="card">
    <div class="pad between" style="border-bottom:1px solid var(--line)">
      <div>
        <p class="sec-t">上传填好的模板</p>
      </div>
      <span class="tag">.csv · UTF-8</span>
    </div>
    <div class="pad">
      <div class="drop ${pickedFile?'has':''}">
        ${pickedFile ? `<div class="file">
            <span class="ico">CSV</span>
            <div style="min-width:0">
              <b style="margin:0">${esc(pickedFile.name)}</b>
              <div class="muted" style="font-size:12px">${pickedFile.size} · 853 行数据（含表头与说明行共 855 行）</div>
            </div>
            <button class="btn sm" style="margin-left:auto" data-act="clear">换一份</button>
          </div>`
        : `<b>把填好的模板拖进来</b>
          <div class="muted" style="font-size:12.5px">或 <button class="btn sm" data-act="pick">选择文件</button></div>`}
      </div>
      <div class="row" style="margin-top:14px">
        <button class="btn p" data-act="run" ${pickedFile?'':'disabled'}>开始导入</button>
        <span class="muted" style="font-size:12.5px">一次最多 1000 行；文件先过表头校验，不合格整份退回。1000 行实测约 1 分半，页面要一直停在导入中</span>
      </div>
    </div>
  </section>`;
}

function countsBar(s){
  const okPct = s.total ? Math.round(100*s.imported/s.total) : 0;
  return `<div class="counts">
    <div class="cnt total"><b>${s.total}</b><span>文件里的数据行</span></div>
    <div class="cnt ok"><b>${s.imported}</b><span>已导入</span></div>
    <div class="cnt bad"><b>${s.error}</b><span>未导入</span></div>
    <div class="cnt bar"><span class="track"><i class="g" style="width:${okPct}%"></i><i class="r" style="width:${100-okPct}%"></i></span></div>
  </div>`;
}

function rowsTable(rows, cap){
  if (!rows.length) return `<div class="pad muted" style="font-size:13px">没有未导入的行。</div>`;
  return `<table>
    <colgroup><col style="width:64px"><col style="width:150px"><col></colgroup>
    <thead><tr><th>行号</th><th>字段</th><th>原因</th></tr></thead>
    <tbody>
      ${rows.slice(0,cap).map(([n,f,c,m]) => `<tr>
        <td class="num">${n}</td>
        <td>${esc(f)}<span class="code" title="错误报告里按这个码归类">${esc(ICON[c]||c)}</span></td>
        <td class="why">${esc(m)}</td>
      </tr>`).join("")}
    </tbody>
  </table>`;
}

function resultCard(s, cap){
  if (s.state === "denied")
    return `<section class="card pad"><div class="note bad" style="margin:0">
      <div><b>${esc(s.note[1])}</b></div></div>
      <div class="muted" style="font-size:12.5px">找系统所有者开一个全局管理或全局经办的角色。</div></section>`;
  if (s.state === "fileerr")
    return `<section class="card"><div class="pad"><div class="note bad" style="margin:0">
      <div><b>${esc(s.note[1])}</b><div style="margin-top:4px">${esc(s.note[2])}</div></div></div>
      <div class="row" style="margin-top:12px"><button class="btn" data-act="reset">重新选文件</button></div></div></section>`;

  const shown = Math.min(cap, s.rows.length);
  return `<section class="card">
    ${countsBar(s)}
    ${s.note[1] ? `<div class="pad" style="padding-bottom:0"><div class="note ${s.note[0]}" style="margin:0 0 0">
      <div><b>${esc(s.note[1])}</b>${s.note[2]?`<div style="margin-top:4px">${esc(s.note[2])}</div>`:""}</div></div></div>` : ""}
    <div class="pad between" style="padding-bottom:10px">
      <p class="sec-t">未导入的行${s.rows.length>shown?`（显示前 ${shown} 条，共 ${s.error} 条）`:""}</p>
      <div class="row">
        <button class="btn" data-act="download" ${s.error?'':'disabled'}>下载错误报告（CSV）</button>
        <button class="btn" data-act="batches">最近导入</button>
      </div>
    </div>
    ${rowsTable(s.rows, cap)}
    ${s.replayed ? `<div class="pad faint" style="font-size:12px">报告里给了每一条对应的旧行号，可以回 Excel 逐行核。</div>` : ""}
  </section>`;
}

function render(){
  const s = STATE[playState];
  /* `attempted`（试过了）与 `isDone`（进去了）是两件事：
     文件级错误与非 L1 拒绝都「试过了」，但它们没有计数条、也不该把上传区塌成细 bar。
     初版把两者合成一个 done 判断，于是这两种状态在页面上**根本不出现** ——
     探针当场抓到了（"非 L1 态给出拒绝原因"红）。 */
  const attempted = s.state !== "idle";
  const isDone = s.state === "done";
  document.getElementById("scopeTag").className = "tag " + (s.state === "denied" ? "bad" : "brand");
  document.getElementById("scopeTag").textContent = s.state === "denied" ? "无 L1 范围" : "L1 · 全公司";

  let html = "";
  if (variant === "A"){
    html = `<div class="stack">
      <section class="card" style="overflow:hidden">
        <div class="pad between" style="border-bottom:1px solid var(--line)">
          <div class="row">
            <span class="muted" style="font-size:12.5px">模板</span>
            <span class="seg">${Object.keys(TPL).map(k=>`<button data-tpl="${k}" class="${k===tplKind?'on':''}">${TPL[k].name}</button>`).join("")}</span>
          </div>
          <div class="row"><button class="btn" data-act="tpl">下载「${TPL[tplKind].name}」模板</button></div>
        </div>
        ${fieldsBlock(tplKind)}
      </section>
      ${uploadCard(false)}
      ${attempted ? resultCard(s, 12) : ""}
    </div>`;
  } else if (variant === "B"){
    html = `<div class="grid">
      <div class="side">
        <section class="card" style="overflow:hidden">
          <div class="pad" style="border-bottom:1px solid var(--line)"><p class="sec-t">模板</p></div>
          <div class="pad" style="padding-top:10px">
            <div style="display:flex;flex-direction:column;gap:6px">
              ${Object.keys(TPL).map(k=>`<button class="btn" data-tpl="${k}" style="${k===tplKind?'border-color:var(--brand);color:var(--brand);font-weight:600;text-align:left':'text-align:left'}">${TPL[k].name}模板</button>`).join("")}
            </div>
            <button class="btn p" style="width:100%;margin-top:12px" data-act="tpl">下载当前模板</button>
          </div>
          ${fieldsBlock(tplKind)}
        </section>
      </div>
      <div>
        ${attempted ? resultCard(s, 14) : uploadCard(false)}
      </div>
    </div>`;
  } else {
    html = `${isDone ? uploadCard(true) : ""}
      ${attempted ? resultCard(s, 18) : `<div class="stack" style="display:flex;flex-direction:column;gap:14px;max-width:760px">
        <section class="card" style="overflow:hidden">
          <div class="pad between" style="border-bottom:1px solid var(--line)">
            <div class="row"><span class="muted" style="font-size:12.5px">模板</span>
              <span class="seg">${Object.keys(TPL).map(k=>`<button data-tpl="${k}" class="${k===tplKind?'on':''}">${TPL[k].name}</button>`).join("")}</span></div>
            <button class="btn" data-act="tpl">下载模板</button>
          </div>
          ${fieldsBlock(tplKind)}
        </section>
        ${uploadCard(false)}
      </div>`}`;
  }
  document.getElementById("content").innerHTML = html;

  document.getElementById("content").className = "content v" + variant;
  // 变体/状态按钮的选中态
  for (const b of document.querySelectorAll("#switcher button")) b.classList.toggle("on", b.dataset.variant === variant);
  for (const b of document.querySelectorAll("#playbar button")) b.classList.toggle("on", b.dataset.state === playState);
  history.replaceState(null, "", "?variant=" + variant);
}

document.getElementById("content").addEventListener("click", (e) => {
  const t = e.target.closest("[data-tpl],[data-act]");
  if (!t) return;
  if (t.dataset.tpl){ tplKind = t.dataset.tpl; pickedFile = {name:`2024-2026历史台账-${TPL[tplKind].name}.csv`, size:"268 KB", rows:853}; render(); return; }
  const act = t.dataset.act;
  if (act === "run" || act === "tpl" || act === "download" || act === "batches") {
    if (act === "run"){ playState = playState === "fileerr" ? "ok" : playState; if (!["ok","all","replay"].includes(playState)) playState = "ok"; }
    render();
  }
  if (act === "reset" || act === "clear" || act === "pick"){ pickedFile = {name:"2024-2026历史台账-事项.csv", size:"268 KB", rows:853}; playState = "ok"; render(); }
});
document.getElementById("switcher").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-variant]"); if (!b) return;
  variant = b.dataset.variant; render();
});
document.getElementById("playbar").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-state]"); if (!b) return;
  playState = b.dataset.state; render();
});
render();
</script>
</body>
</html>
