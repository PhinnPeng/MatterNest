<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>原型 · P5 事项详情（四变体）</title>
<!--
  ════════════════════════════════════════════════════════════════════════════
  PROTOTYPE — 一次性代码，不进主干。回答的问题是：「事项详情页该长什么样？」

  · 四个变体在同一条路由上，用 ?variant=A|B|C|D 切换（可分享、刷新稳定）。
    A/B/C 是 2026-10-11 的首轮产物（C = IQ-17 定稿、也是当时的实现）；
    **D 是 2026-10-12 的改判提案（待 IQ-19 裁定）**，同一个文件里另起，
    A/B/C 一行未动，方便并排对比。
  · D 的两条形态开关：右下角「归档态」（只读终态）、`&demo=empty`（三处空态）。
  · 色值全部取自 src/app/theme/brand.ts（BRAND / PAPER / INK），
    左栏与密度照抄 AppShell —— 目的是「贴着真实应用看」，不是凭空画。
  · 数据是内存里的假数据：真实库当前不可达（127.0.0.1:30432 ECONNREFUSED），
    挂不上真路由，所以走「双击即开」的单文件形态。见 SKILL「No persistence」。
  · 变体之间**刻意不复用布局**：只有色板与字体是共用的。共用布局等于没做原型。

  为什么必须先定形态：案件详情是「节点中心」（5 Tab + 预设节点 + 时间轴），
  事项详情按 IQ-5 必须是「评论中心」（无预设节点、节点可空、评论是主交互面）。
  两者形态相反。若不先定，施工票会现场做一个缩小版案件详情，
  也就顺手抹平了「事项是台账、案件是战场」这条刻意的非对称。

  ⚠ 写本文件的文案前先读 `.trellis/spec/frontend/component-guidelines.md` 的「副标题纪律」：
  **默认没有第二行说明**。凡是"复述旁边已经写着的东西"或"把规则/排序/权限讲成散文"的文字
  （仓库里叫**旁白**），一律删；要解释只落四类落点（空态/控件说明/tooltip/字段表）。
  D 变体第一版就在这里栽过一次：「关注人 · 可管理：经办人 / 全公司范围 / 创建人」正是旁白。
  注意本文件不在 `src/` 下，**lint-guard 的源码断言扫不到它**，只能靠这句话。
  ════════════════════════════════════════════════════════════════════════════
-->
<style>
  /* ── 色板：与 brand.ts 逐字对应（改这里不会影响真应用，这里只是抄了一份）── */
  :root{
    --brand:#2f5fe0; --brand-hover:#4473f0; --brand-active:#234ac2;
    --success:#1a9c6b; --overdue:#c2363b; --soon:#9a5a00;
    --sider-bg:#1d2433; --sider-grad:#22304a; --sider-item:#c3ccdd; --sider-accent:#2f5fe0;
    --paper:#f7f8fa;
    --ink:#1d2433; --ink-2:#4f5a6f; --ink-3:#616a79; --ink-4:#a4abb8;
    --line:#eceef3; --rail:#c8ccd4;
    --r:8px; --shadow:0 1px 2px rgba(29,36,51,.06),0 1px 3px rgba(29,36,51,.04);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font:14px/1.55 -apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--ink); background:var(--paper); -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;cursor:pointer}

  /* ── AppShell：照抄真实外壳（深色左栏 + 顶栏）── */
  .shell{display:flex;min-height:100vh}
  .sider{
    width:212px;flex:none;background:var(--sider-bg);color:var(--sider-item);
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
  }
  .sider-brand{padding:16px 20px 14px}
  .sider-brand b{display:block;color:#fff;font-size:15px;letter-spacing:.2px}
  .sider-brand span{display:block;font-size:11px;color:#8d97ab;margin-top:3px}
  .nav{padding:6px 10px;flex:1;overflow:auto}
  .nav-group{font-size:11px;color:#6f7a90;padding:12px 10px 5px;letter-spacing:.5px}
  .nav-item{
    display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:6px;
    color:var(--sider-item);font-size:13.5px;margin:1px 0;
  }
  .nav-item.on{background:var(--brand);color:#fff;font-weight:500}
  .nav-item .ic{width:16px;text-align:center;opacity:.9}
  .nav-item .i{opacity:.88}
  .sider-foot{padding:12px 14px;border-top:1px solid rgba(255,255,255,.08)}
  .who-in-sider{display:flex;align-items:center;gap:9px}
  .who-in-sider b{display:block;color:#fff;font-size:13px;font-weight:600}
  .who-in-sider span{display:block;font-size:11px;color:#8d97ab;margin-top:1px}
  .sider-logout{
    width:100%;margin-top:10px;background:none;border:1px solid rgba(255,255,255,.16);
    color:#c3ccdd;border-radius:6px;padding:5px;font-size:12px;
  }
  .sider-logout:hover{background:rgba(255,255,255,.08);color:#fff}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{
    height:60px;background:#fff;border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:20;
  }
  .topbar h1{font-size:16px;margin:0;font-weight:600}
  .who{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-3)}
  .avatar{width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;
    display:grid;place-items:center;font-size:12px;font-weight:600}

  .content{padding:20px 24px 96px;flex:1}

  /* ── 通用件 ── */
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .pad{padding:16px 18px}
  .row{display:flex;gap:10px;align-items:center}
  .between{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border-radius:20px;
    background:#eef1f6;color:var(--ink-2);white-space:nowrap}
  .tag.hi{background:#fdeeee;color:var(--overdue)}
  .tag.mid{background:#fff4e6;color:var(--soon)}
  .tag.ok{background:#e9f7f1;color:var(--success)}
  .tag.on{background:var(--brand);color:#fff}
  .btn{border:1px solid var(--rail);background:#fff;border-radius:6px;padding:6px 13px;color:var(--ink-2);font-size:13px}
  .btn:hover{border-color:var(--brand);color:var(--brand)}
  .btn.p{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.p:hover{background:var(--brand-hover)}
  .btn.sm{padding:3px 9px;font-size:12px}
  .muted{color:var(--ink-3)}
  .faint{color:var(--ink-4)}
  .lbl{font-size:12px;color:var(--ink-3)}
  /* 下拉菜单（标题栏「更多」） */
  .more-wrap{position:relative}
  .more-menu{
    position:absolute;right:0;top:calc(100% + 6px);min-width:172px;background:#fff;
    border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 26px rgba(29,36,51,.16);
    padding:5px;display:none;z-index:60;
  }
  .more-menu.on{display:block}
  .mi{display:block;width:100%;text-align:left;background:none;border:0;padding:7px 10px;
    border-radius:6px;font-size:13px;color:var(--ink)}
  .mi:hover{background:#f2f5fa}
  .mi.pri{color:var(--brand);font-weight:500}
  .mi.danger{color:var(--overdue)}
  .mi-sep{height:1px;background:var(--line);margin:5px 2px}
  .kv{display:grid;grid-template-columns:76px 1fr;gap:8px 10px;font-size:13px}
  .kv dt{color:var(--ink-3)}
  .kv dd{margin:0;color:var(--ink)}
  /* 左栏节点与右栏「基本事实」块等高；处置记录移到右栏基本事实之下 */
  .split{display:grid;grid-template-columns:330px 1fr;gap:16px;align-items:stretch}
  .node-card{display:flex;flex-direction:column}
  .node-empty{flex:1;display:flex;flex-direction:column;justify-content:center}
  .cmt-scroll{max-height:560px;overflow:auto;min-height:0}
  .sec-t{font-size:13px;font-weight:600;color:var(--ink);margin:0 0 10px;display:flex;align-items:center;gap:7px}
  .sec-t::before{content:"";width:3px;height:13px;background:var(--brand);border-radius:2px}
  .hr{height:1px;background:var(--line);margin:14px 0}

  /* 状态胶囊 */
  .st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px}
  .st::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--rail)}
  .st.open::before{background:var(--rail)}
  .st.prog::before{background:var(--brand)}
  .st.ok::before{background:var(--success)}

  /* 评论条目 */
  .cmt{display:flex;gap:10px;padding:12px 0;border-bottom:1px dashed var(--line)}
  .cmt:last-child{border-bottom:0}
  .ava{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
    font-size:12px;font-weight:600;color:#fff}
  .cmt-b{flex:1;min-width:0}
  .cmt-h{display:flex;align-items:baseline;gap:8px;margin-bottom:3px}
  .cmt-h b{font-size:13px}
  .cmt-h .t{font-size:11.5px;color:var(--ink-4)}
  .cmt-t{font-size:13.5px;color:var(--ink);white-space:pre-wrap}
  .cmt-a{margin-top:6px;display:flex;gap:12px;font-size:12px;color:var(--ink-3)}

  /* Tab */
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 18px}
  .tab{padding:10px 14px;font-size:13.5px;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
  .tab .n{font-size:11px;color:var(--ink-4);margin-left:4px}
  .tab.on .n{color:var(--brand)}

  /* 节点 */
  .node{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line)}
  .node:last-child{border-bottom:0}
  .node-dot{width:8px;height:8px;border-radius:50%;background:var(--rail);margin-top:6px;flex:none}
  .node-dot.soon{background:var(--soon)}
  .node-dot.late{background:var(--overdue)}

  /* 空态 */
  .empty{padding:22px 12px;text-align:center;color:var(--ink-3)}
  .empty .ic{font-size:22px;opacity:.35}
  .empty p{margin:6px 0 10px;font-size:13px}

  /* 变体切换条 */
  .sw{
    position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:99;
    display:flex;align-items:center;gap:4px;background:var(--ink);color:#fff;
    border-radius:22px;padding:5px 8px;box-shadow:0 6px 22px rgba(29,36,51,.28);
  }
  .sw button{background:none;border:0;color:#fff;width:26px;height:26px;border-radius:50%;font-size:15px;line-height:1}
  .sw button:hover{background:rgba(255,255,255,.16)}
  .sw .lb{font-size:12.5px;padding:0 10px;white-space:nowrap}
  .sw .lb b{font-weight:600}
  .sw .lb i{font-style:normal;color:#aeb6c6;margin-left:6px}
  .sw .warn{font-size:11px;color:#ffb4b4;padding:0 8px;border-left:1px solid rgba(255,255,255,.2);margin-left:4px}
  .sw button.wide{width:auto;padding:0 10px;font-size:12px;border-radius:12px}

  /* ══════════ 变体 D：左内容 + 右评论栏（IQ-19 提案，2026-10-12） ══════════ */
  /* 页头：编号与标题同行、描述与处置措施进首屏、动作在最右 */
  .d-head{margin-bottom:14px}
  .d-meta{display:flex;align-items:center;gap:9px;margin-bottom:8px;font-size:12px;flex-wrap:wrap}
  .d-title{margin:0 0 8px;font-size:19px;line-height:1.45;font-weight:600;letter-spacing:-.01em;max-width:34em}
  .d-desc{margin:0;font-size:13.5px;line-height:1.66;color:var(--ink-2);max-width:76ch;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .d-desc.open{-webkit-line-clamp:unset}
  .d-more-desc{margin-top:5px;font-size:12px;color:var(--brand);background:none;border:0;padding:0}
  .d-more-desc:hover{text-decoration:underline}
  .d-acts{display:flex;gap:8px;flex:none;align-items:center;flex-wrap:wrap;justify-content:flex-end}

  /* 两列：内容自适应 + 评论栏固定 340（1366 下本原型容器 1106 = 750 + 16 + 340；
     真应用同宽度下 1118 = 762 + 16 + 340） */
  .d-split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
  .d-rail{position:sticky;top:76px;display:flex;flex-direction:column;gap:12px;
    height:var(--rail-h,640px);min-height:320px}

  /* 页签在内容卡顶部（不是卡片里再套卡片） */
  .d-tabs{display:flex;align-items:center;padding:0 6px;border-bottom:1px solid var(--line);gap:2px}
  .d-tab{border:0;background:none;padding:11px 12px;font-size:13.5px;color:var(--ink-2);
    border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;align-items:center;gap:6px}
  .d-tab:hover{color:var(--ink)}
  .d-tab.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
  .d-rail-fol{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3);white-space:nowrap}
  .d-tab .n{font-size:11px;color:var(--ink-3)}
  .d-tab.on .n{color:var(--brand)}
  .d-panel{padding:14px 18px 18px}
  .d-panel[hidden]{display:none}

  /* 评论栏：自己的滚动区，输入框钉在底部。
     高度用 JS 量出的 --rail-h（见 render），保证「本栏底边永远在折线以上 20px」——
     写死 calc(100vh - 96px) 会忽略本栏自己的起始偏移（页头卡 ~200px），
     结果输入框落到首屏之外（终检实测：768 视口下低 198px）。 */
  .d-cmt{display:flex;flex-direction:column;min-height:0;flex:1;overflow:hidden}
  .d-cmt-h{padding:11px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline}
  .d-cmt-h b{font-size:13px}
  /* 340px 栏里评论头四项挤在一行会把姓名撕成两行（实测"王凯/锋"），允许换行 */
  .d-cmt .cmt-h{flex-wrap:wrap;row-gap:2px}
  .d-cmt .cmt-h b{white-space:nowrap}
  /* 角色与时间戳是内容不是装饰：走 muted（5.46:1），不走 faint（2.31:1） */
  .d-cmt .cmt-h .t{color:var(--ink-3)}
  .d-cmt-list{padding:2px 16px 6px;overflow:auto;flex:1;min-height:80px}
  .d-cmt-box{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:#fbfcfe}
  .d-cmt-box textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:8px 10px;
    font:inherit;font-size:13px;line-height:1.5;resize:none;color:var(--ink);background:#fff}
  .d-cmt-box textarea::placeholder{color:var(--ink-3)}
  .d-cmt-box textarea:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px rgba(47,95,224,.12)}
  .d-cmt-box .bar{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--ink-3)}
  .d-readonly{padding:10px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3);background:#fbfcfe}

  /* 关注人下拉：行内 X 只在 hover/focus 时出现 */
  .d-fol-head{padding:6px 10px 3px;font-size:11.5px;color:var(--ink-3)}
  .d-fol-row{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:6px}
  .d-fol-row:hover{background:#f2f5fa}
  .d-x{margin-left:auto;border:0;background:none;color:var(--ink-3);border-radius:4px;
    padding:1px 5px;line-height:1.4;opacity:0;display:inline-flex;align-items:center}
  .d-fol-row:hover .d-x,.d-fol-row:focus-within .d-x{opacity:1}
  .d-x:hover{color:var(--overdue);background:#fdeeee}
  .ava.sm{width:20px;height:20px;font-size:11px}

  /* 节点行：压到 762px 列宽的写法（类型/时间/状态挤一行会断，所以分两行） */
  .d-node{padding:11px 0;border-bottom:1px dashed var(--line)}
  .d-node:last-child{border-bottom:0}
  .d-node-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .d-node-h b{font-size:13.5px}
  .d-node-s{font-size:12px;color:var(--ink-3);margin-top:3px}
  .d-node-a{display:flex;gap:12px;font-size:12px;color:var(--ink-3);margin-top:6px}
  /* 终检实测：归档态的「手动加节点」disabled=true 却与在办态逐项相同 —— 补上禁用态 */
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn:disabled:hover{border-color:var(--rail);color:var(--ink-2)}
  .d-node-a button{border:0;background:none;padding:0;color:var(--ink-3);font-size:12px}
  .d-node-a button:hover{color:var(--brand)}

  /* 活动日志：竖线 + 点，关键动作加深 */
  .d-log{position:relative;padding-left:18px}
  .d-log::before{content:"";position:absolute;left:3px;top:8px;bottom:8px;width:1px;background:var(--line)}
  .d-log-i{position:relative;padding:7px 0}
  .d-log-i::before{content:"";position:absolute;left:-18px;top:12px;width:7px;height:7px;border-radius:50%;
    background:#fff;border:1.5px solid var(--rail)}
  .d-log-i.key::before{border-color:var(--brand)}
  .d-log-t{font-size:13px}
  .d-log-m{font-size:11.5px;color:var(--ink-3);margin-top:1px}

  /* 详细信息：定义表，两列起 */
  .d-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 24px;font-size:13px}
  .d-fact{display:flex;gap:10px;align-items:baseline;min-width:0}
  .d-fact dt{flex:none;width:64px;color:var(--ink-3);font-size:12px}
  .d-fact dd{margin:0;min-width:0}

  /* 图标：统一 1.5 描边、currentColor（不用 emoji/unicode 当图标系统） */
  .i{display:inline-block;vertical-align:-2px;flex:none}
  .i.sm{vertical-align:-1px}

  /* 浏览器自带的那几个面：选区、焦点环、滚动条 —— 一并主题化 */
  ::selection{background:rgba(47,95,224,.16)}
  :focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
  .d-cmt-list{scrollbar-width:thin;scrollbar-color:#d8dde6 transparent}
  .d-cmt-list::-webkit-scrollbar{width:8px}
  .d-cmt-list::-webkit-scrollbar-thumb{background:#d8dde6;border-radius:4px}

  /* ══════════ D2（2026-10-12 第二轮）：页头并入左列 / 详细信息回送到描述下方 ══════════ */
  .d-main{display:flex;flex-direction:column;gap:14px;min-height:var(--rail-h,640px)}
  .d-content{flex:1;display:flex;flex-direction:column;min-height:0}
  .d-head{margin-bottom:0}
  .d-field{margin-top:13px}
  .d-field-t{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-3);margin-bottom:5px}
  .d-edit{border:0;background:none;font-size:12px;color:var(--brand);padding:0}
  .d-edit:hover{text-decoration:underline}
  /* 描述：BlockNote 形态 —— **没有常驻工具条**（格式条选中才浮出、/ 唤出块菜单） */
  /* 描述：与标题拉出层级（标题 19/600 墨色；正文 13.5/次级色/行高 1.72/74ch） */
  .d-rich{font-size:13.5px;line-height:1.72;color:var(--ink-2);max-width:74ch}
  .d-rich.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .d-rich.open{-webkit-line-clamp:unset}
  .d-rich p{margin:0 0 5px}
  .d-rich p:last-child{margin-bottom:0}
  .d-rich ul,.d-rich ol{margin:4px 0 0;padding-left:19px}
  .d-rich li{margin:1px 0}

  .d-facts-row{display:flex;flex-wrap:wrap;gap:7px 20px;margin-top:13px;padding-top:12px;border-top:1px solid var(--line);font-size:12.5px}
  .d-fact-1{display:inline-flex;align-items:baseline;gap:6px}

  .d-pop-wrap{position:relative}
  .d-pop-t{border-bottom:1px dashed var(--rail);cursor:default}
  .d-pop{display:none;position:absolute;left:-10px;top:calc(100% + 7px);z-index:50;width:300px;
    background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(29,36,51,.16);padding:12px 14px}

  /* 参考材料（当事人/参与人/附件/登记信息）：收在字段行下方，默认收起 */
  .d-fold{margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}
  .d-fold summary{cursor:pointer;font-size:12.5px;color:var(--brand);list-style:none}
  .d-fold summary::-webkit-details-marker{display:none}
  .d-fold-body{padding-top:12px}
  /* 关注：**两个按钮合成一组**（批注：眼睛自己是按钮、文字+箭头是另一个按钮）
     —— 眼睛 = 切换我关注；文字+箭头 = 开菜单。两段共用一条边框、中间不留缝。 */
  .d-group{display:inline-flex;align-items:stretch}
  .d-group>.btn{border-radius:0}
  .d-group>.btn:first-child{border-radius:6px 0 0 6px;padding:6px 9px}
  .d-group>.more-wrap{display:inline-flex}
  .d-group>.more-wrap>.btn{border-radius:0 6px 6px 0;border-left:0}
  .d-group>.btn.on{border-color:var(--brand);color:var(--brand);background:#f2f6ff}
  .d-group>.btn.on+.more-wrap>.btn{border-color:var(--brand);color:var(--brand);background:#f2f6ff}
  /* 描述：BlockNote 形态 —— **没有常驻工具条**；选中文字浮出格式条，输入 / 唤出块菜单 */
  .d-rte{position:relative}
  .d-rte-float{position:absolute;top:-18px;left:0;z-index:20;display:none;gap:1px;align-items:center;
    background:var(--ink);border-radius:6px;padding:3px;box-shadow:0 6px 18px rgba(29,36,51,.24)}
  .d-rte-float.on{display:flex}
  .d-rte-float button{border:0;background:none;color:#fff;border-radius:4px;padding:3px 6px;display:inline-flex}

  .d-rte-hint{margin-top:6px;font-size:11.5px;color:var(--ink-3);display:none;align-items:center;gap:5px}
  .d-rte-hint.on{display:flex}
  .d-rte[contenteditable="true"],.d-rte.editing .d-rich{outline:none}
  .d-rte.editing{background:#fbfcfe;border:1px solid var(--line);border-radius:6px;padding:10px 12px}

  /* 节点面板内的操作行（页签栏里不再有按钮） */
  .d-nodes-act{display:flex;justify-content:flex-end;margin-bottom:8px}
</style>

<script>
/* ══════════════ 假数据（内存，刷新即丢） ══════════════ */
const M = {
  code:'FX-20260928-014',
  name:'恒基建设承建厂房 · 供应商延迟交付与现场停工',
  type:'合同违约', level:'高', found:'2026-09-28',

  desc:'承建厂房主体已封顶，但屋面防水供应商连续两次延迟交付，现场停工待料已 11 天。施工方发来催告函，要求我方 9 日内答复并承担窝工损失。',
  measure:'已要求供应商项目负责人书面说明；同步请工程部核减工期索赔口径。',
  converted:[],

    {n:'供应商催告函.pdf',k:'函件',s:'412 KB'},

  ],

     x:'这条我来跟。先把催告函的答复期限挂上，再约施工方碰一次。',meta:'指派给自己',act:'owner'},
    {a:'赵凌',c:'#1a9c6b',role:'法务负责人',t:'2026-09-29 09:41',
     x:'@王凯锋 催告函里写的是「9 日内答复」，这个期限要挂上，别靠记忆。',meta:'@提及',act:'mention'},

     x:'补充：工程部说窝工损失大概 60 万，具体金额还在核。',meta:''},
    {a:'王凯锋',c:'#2f5fe0',role:'全局管理',t:'2026-10-02 17:02',
     x:'先按「合同违约 · 高」挂着，不急着转案件——对方还没正式立案。等真立案那天再转。',meta:''},

  nodes:[],   // ← 关键：事项无预设节点，默认就是空的
};

const esc = s => String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const levelTag = l => l==='高' ? '<span class="tag hi">高</span>' : l==='中' ? '<span class="tag mid">中</span>' : '<span class="tag">低</span>';

/* ══════════════ 复用的「小件」（不是布局——布局各变体独立） ══════════════ */
function shellHead(extra){
  return `
  <div class="card pad" style="margin-bottom:16px">

            <button class="mi">＋ 加关注人</button>

}
function commentsBlock(){
  return M.comments.map(c=>`
    <div class="cmt">
      <div class="ava" style="background:${c.c}">${c.a[0]}</div>

/* ══════════════════════════════════════════════════════════════════
   变体 A（**已采纳并深化**）—— 「左栏工作面 + 右栏档案」
   主张：事项页有两类完全不同的内容，不该挤在一处——
     · 左栏 = **现在正在发生什么**：事项节点（硬期限）+ 处置记录（评论沟通）。
       处置记录在底部并撑满剩余高度，因为它是事项的主交互面。
     · 右栏 = **这件事是什么**：基本事实 / 活动日志 两个 Tab，纯档案查阅。
   标题栏动作收敛成「编辑 / 变更处理人 / 更多」，把低频动作（转案件、删除、
   复制）收进「更多」，避免主按钮位被占满。

function VariantA(){

      <div class="pad">${commentsBlock()}</div>

}

/* ══════════════════════════════════════════════════════════════════
   变体 C（深化版）—— 「单栏流式 + 等高节点栏」
   承接 C 的主张：不给事项套「详情页」的固定字段组合，内容按流式往下铺，
   最新在最上。深化三处：
     · 左侧加一等高「事项节点」栏——流式单栏的代价是左右失衡；节点固定在
       左侧后，无论右侧流多长，节点与「+手动加节点」始终在视线内。

   ══════════════════════════════════════════════════════════════════ */

  return `

      <div class="node-empty">

    <div style="min-width:0">

        <div class="between" style="align-items:flex-start">
          <div style="min-width:0">
            <div class="row" style="margin-bottom:6px">
              <span class="lbl">${M.code}</span>
              <span class="st ok">已登记</span>
              ${M.owner?'':'<span class="tag hi">未指派</span>'}
              ${levelTag(M.level)}
            </div>
            <h2 style="margin:0 0 6px;font-size:18px;line-height:1.4;font-weight:600">${esc(M.name)}</h2>
            <div class="lbl">${M.type} · 发现于 ${M.found} · 敞口 ${M.amount.toLocaleString()} · 经办 <b style="color:${M.owner?'var(--ink)':'var(--overdue)'}">${M.owner||'（空）'}</b> · 关注 ${M.followers.join('、')}</div>
          </div>
          <div class="row" style="flex:none">
            <button class="btn">编辑</button>

    <details class="d-fold">
      <summary>▸ 当事人 / 参与人 / 附件 / 登记信息</summary>
      <div class="d-fold-body">
        <div class="row" style="gap:10px;flex-wrap:wrap">
          <span>鼎宏防水材料有限公司</span><span class="tag">被告</span>
        </div>
        <div class="row" style="gap:8px;flex-wrap:wrap;margin-top:10px">
          <span class="tag">赵凌·协办</span><span class="tag">李晨·关注</span><span class="tag">孙敏·关注</span>
        </div>
        <div style="margin-top:12px">
          ${M.attachments.map(a=>`
            <div class="between" style="padding:6px 0;border-bottom:1px dashed var(--line)">
              <div style="font-size:13px">${ic('file')} ${a.n}</div>
              <div class="lbl">${a.k} · ${a.s}</div>
            </div>`).join('')}
        </div>
        <div class="d-facts" style="margin-top:12px">
          <div class="d-fact"><dt>创建</dt><dd>${M.createdAt}</dd></div>
          <div class="d-fact"><dt>更新</dt><dd>2026-10-04 09:00</dd></div>
        </div>
      </div>
    </details>
  </div>

      <!-- ② 内容卡：页签（事项节点 / 活动日志）+ 面板。
           1366 下本原型容器 1106 = 750 左列 + 16 + 340 右栏；真应用同宽度下是 1118。 -->
      <div class="card d-content">
        <div class="d-tabs" role="tablist" aria-label="事项内容">
          <button class="d-tab on" role="tab" data-t="nodes" aria-selected="true" tabindex="0" id="tab-nodes" aria-controls="panel-nodes">事项节点 <span class="n">${nodes.length}</span></button>
          <button class="d-tab" role="tab" data-t="log" aria-selected="false" tabindex="-1" id="tab-log" aria-controls="panel-log">活动日志 <span class="n">${DLOG.length}</span></button>
        </div>

        <!-- 面板① 事项节点 -->
        <div class="d-panel" data-p="nodes" role="tabpanel" id="panel-nodes" aria-labelledby="tab-nodes">
          <!-- 手动添加节点只出现在这个面板里（批注 4）：它是节点列表的动作，不是页头的动作 -->
          ${archived?'':`<div class="d-nodes-act"><button class="btn sm" id="dAddNode">${ic('plus')} 手动添加节点</button></div>`}
          ${nodes.length === 0
            ? `<div class="empty"><p>还没有节点。</p>
                 <p class="muted" style="font-size:12.5px">事项不预设流程节点：只有确有时限（如答复期）时才手动加一个时间点。</p>
                 ${archived?'':'<button class="btn sm" id="dAddNode2">'+ic('plus')+' 加第一个节点</button>'}</div>`
            : nodes.map(n=>`
              <div class="d-node">
                <div class="d-node-h">
                  <b>${esc(n.n)}</b>
                  <span class="tag ${n.tone==='prog'?'on':''}">${n.st}</span>
                  ${n.confirmed?'':'<span class="tag">时间待定</span>'}
                </div>
                <div class="d-node-s">${ic('clock')} ${n.when?n.when:'未确认时间'}
                  <span class="lbl"> · 负责人 ${n.who}</span></div>
                ${archived?'':`<div class="d-node-a"><button>开始</button><button>完成</button><button>改待定</button></div>`}
              </div>`).join('')}
          ${/* 「事项不预设节点：…」这句原来也贴在这里（有节点时）。它是**解释功能**而不是
                解释这条记录 —— 删除。它只该出现在空态里（上面 nodes.length === 0 那一支）。 */ ''}
        </div>

        <!-- 面板② 活动日志 -->
        <div class="d-panel" data-p="log" role="tabpanel" id="panel-log" aria-labelledby="tab-log" hidden>
          <div class="d-log">
            ${[...DLOG].reverse().map(l=>`
              <div class="d-log-i ${l.k?'key':''}">
                <div class="d-log-t">${l.t}</div>
                <div class="d-log-m">${l.m}</div>
              </div>`).join('')}
          </div>
          <div class="lbl" style="margin-top:12px;font-size:12px">只显示最近 20 条，更早的走审计导出。</div>
        </div>

        <!-- 原「详细信息」页签整块搬到页头的描述下方（③）：字段行 + 默认收起的参考材料区。
             页签因此只剩两个：动态内容（节点、日志）才配得上页签。 -->
      </div>
    </div>

    <!-- 右栏：只剩评论（批注 1 把「已转案件」收进页头字段行 + hover 详情；
         腾出的高度直接给评论：768 视口下多出 116px ≈ 1 条） -->
    <aside class="d-rail">

      <div class="card d-cmt">
        <div class="d-cmt-h">
          <b>评论</b>
          <span class="lbl">${comments.length} 条</span>
        </div>
        <div class="d-cmt-list">
          ${comments.length === 0
            ? `<div class="empty" style="padding:26px 8px"><p>还没有评论。</p>
                 <p class="muted" style="font-size:12.5px">处置沟通、外部回音都记在这里，它不会被折叠。</p></div>`
            : [...comments].reverse().map(c=>`
              <div class="cmt">
                <div class="ava" style="background:${c.c}">${c.a[0]}</div>
                <div class="cmt-b">
                  <div class="cmt-h">
                    <b>${c.a}</b><span class="t">${c.role}</span><span class="t">${c.t}</span>
                    ${c.meta?`<span class="tag" style="font-size:11px">${c.meta}</span>`:''}
                  </div>
                  <div class="cmt-t">${c.x}</div>
                </div>
              </div>`).join('')}
        </div>
        ${archived
          ? `<div class="d-readonly">要追加内容，需先由持「撤销归档」权限的人撤销归档。</div>`
          : `<div class="d-cmt-box">
               <textarea rows="3" placeholder="写一条评论…" aria-label="写一条评论"></textarea>
               <div class="bar"><span>@ 可提及同事 · 发布后本人可编辑</span><button class="btn p sm">发布</button></div>
             </div>`}
      </div>
    </aside>
  </div>`;
}
/* ══════════════ 变体切换 ══════════════ */
const V = {
  A:{n:'左栏工作面 + 右栏档案（备选）',f:VariantA},
  B:{n:'对照式 · 全景条 + 对话流（备选）',f:VariantB},
  C:{n:'单栏流式 + 等高节点栏（现行实现 · IQ-17）',f:VariantC},
  D:{n:'左内容 + 右评论栏（待裁定 · IQ-19 提案）',f:VariantD},
};
const keys = Object.keys(V);
const qs = new URLSearchParams(location.search);
let cur = qs.get('variant')?.toUpperCase();
if (!V[cur]) cur = 'D';                    // 默认停在待裁定的 D
let archived = qs.get('state') === 'archived';

/* 侧栏图标：外壳是静态 HTML，图标一次注入（与真应用一样用 SVG，不用 emoji） */
document.querySelectorAll('.nav-item[data-ic]').forEach(el => {
  el.insertAdjacentHTML('afterbegin', ic(el.dataset.ic));
});

/* 让评论栏的底边（含输入框）永远落在折线以上 20px。
   终检实测：写死 max-height:calc(100vh - 96px) 会忽略本栏自己的起始偏移（页头卡 ~200px），
   768 视口下输入框落到首屏之外 198px。量的时候先把 sticky 摘掉，否则量到的是已经卡住的 76px。 */
function fitRail(){
  const rail = document.querySelector('.d-rail');
  if (!rail) return;
  const prev = rail.style.position;
  rail.style.position = 'static';
  const top = rail.getBoundingClientRect().top + window.scrollY;
  rail.style.position = prev || '';
  const h = Math.max(320, window.innerHeight - top - 20);
  document.documentElement.style.setProperty('--rail-h', Math.round(h) + 'px');
}

/* 待裁定变体的交互（页签 / 收藏 / 关注人名单 / 描述展开）。
   刻意只做「看得见的开关」：不写库、不发请求，点了只是本页内的状态。 */
function wireD(){
  const root = document.getElementById('root');

  // 页签：补 aria-selected 与单点 Tab 停（终检：三个 tab 全可 Tab 聚焦、无 aria-selected）
  const tabs = [...root.querySelectorAll('.d-tab')];
  const select = (t) => {
    tabs.forEach(x => {
      const on = x === t;
      x.classList.toggle('on', on);
      x.setAttribute('aria-selected', String(on));
      x.tabIndex = on ? 0 : -1;
    });
    root.querySelectorAll('.d-panel').forEach(p => { p.hidden = p.dataset.p !== t.dataset.t; });
  };
  tabs.forEach(t => {
    t.onclick = () => select(t);
    t.onkeydown = (e) => {
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      e.preventDefault();
      e.stopPropagation();               // 别让"←/→ 切变体"的全局快捷键把它吃掉
      const i = tabs.indexOf(t);
      const n = tabs[(i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length];
      select(n);
      n.focus();
    };
  });

  // 描述：编辑态 = BlockNote 的形态（浮动格式条 + / 块菜单），不常驻工具条
  const ed = document.getElementById('dEditDesc');
  const rte = document.getElementById('dRte');
  const rteFloat = document.getElementById('dRteFloat');
  const rteHint = document.getElementById('dRteHint');
  if (ed && rte) ed.onclick = (e) => {
    e.stopPropagation();
    const on = rte.classList.toggle('editing');
    rteFloat?.classList.toggle('on', on);
    rteHint?.classList.toggle('on', on);
    ed.textContent = on ? '完成' : '编辑';
    if (on) document.getElementById('dDesc')?.setAttribute('contenteditable', 'true');
    else document.getElementById('dDesc')?.removeAttribute('contenteditable');
  };

  // 描述：只在真被裁时才给「展开全文」
  const d = document.getElementById('dDesc');
  const db = document.getElementById('dDescBtn');
  if (d && db) {
    // 判据不能用 scrollHeight：`-webkit-line-clamp` 下它给的是**被裁后**的高度
    // （实测：内容 98px、被裁到 75px，scrollHeight 也读 75 → 按钮永远不出现）。
    // 摘掉截断量一次真实高度再装回去，是同步且可靠的。
    const isClamped = () => {
      if (d.classList.contains('open')) return false;
      d.classList.remove('clamp');
      const full = d.getBoundingClientRect().height;
      d.classList.add('clamp');
      const shown = d.getBoundingClientRect().height;
      return full > shown + 1;
    };
    const sync = () => { db.hidden = !(d.classList.contains('open') || isClamped()); };
    sync();
    requestAnimationFrame(sync);
    // 字体换入会改变行高，重量一次（本页中文数字混排尤其明显）
    document.fonts?.ready.then(sync);
    new ResizeObserver(sync).observe(d);
    db.onclick = (e) => {
      e.stopPropagation();
      d.classList.toggle('open');
      db.textContent = d.classList.contains('open') ? '收起' : '展开全文';
      sync();
    };
  }

  // 关注：两个按钮一组。眼睛按钮 = 切换我关注；我那一行随之增删、n 同步
  // （规格口径：关注人 = 参与者，附 L2 可见性与节点/评论写权；允许自我授权。
  //   实现侧必须加"我已能看见这条"的前置校验，否则等于可枚举案号自取权限。）
  const list = document.getElementById('dFolList');
  const count = () => {
    const n = document.querySelectorAll('#dFolList .d-fol-row').length;
    document.getElementById('dFolN').textContent = `${n} 人关注`;
    return n;
  };
  const eyeBtn = document.getElementById('dEyeBtn');
  if (eyeBtn) eyeBtn.onclick = (e) => {
    e.stopPropagation();
    const mine = list?.querySelector('.d-fol-you')?.closest('.d-fol-row');
    const on = !mine;
    eyeBtn.classList.toggle('on', on);
    eyeBtn.setAttribute('aria-pressed', String(on));
    eyeBtn.innerText = '';
    eyeBtn.insertAdjacentHTML('afterbegin', ic('eye', on));
    eyeBtn.title = on ? '取消关注' : '关注';
    eyeBtn.setAttribute('aria-label', eyeBtn.title);
    if (list) {
      if (mine) mine.remove();
      else list.insertAdjacentHTML('afterbegin', folRow(DFOL.find((f) => f.me)));
    }
    count();
  };

  // 移出名单里某一行（hover 出的 X）；点「我」那行等价于取消关注
  if (list) list.addEventListener('click', e => {
    const x = e.target.closest('.d-x');
    if (!x) return;
    e.stopPropagation();                 // 行被移除后 target 已脱离 DOM，守卫会误判为点在外面
    const row = x.closest('.d-fol-row');
    const wasMe = !!row.querySelector('.d-fol-you');
    row.remove();
    if (wasMe && eyeBtn) {
      eyeBtn.classList.remove('on');
      eyeBtn.setAttribute('aria-pressed', 'false');
      eyeBtn.innerHTML = ic('eye', false);
      eyeBtn.title = '关注';
      eyeBtn.setAttribute('aria-label', '关注');
    }
    count();
  });
}

function render(){
  document.getElementById('root').innerHTML = V[cur].f(archived);
  document.getElementById('lb').innerHTML = `<b>${cur}</b> <i>${V[cur].n}</i>`;
  const u = new URL(location.href);
  u.searchParams.set('variant', cur);
  if (archived) u.searchParams.set('state', 'archived'); else u.searchParams.delete('state');
  history.replaceState(null, '', u);

  const st = document.getElementById('stateBtn');
  st.style.display = cur === 'D' ? '' : 'none';
  st.textContent = archived ? '在办态' : '归档态';

  if (cur === 'D') { wireD(); fitRail(); }
}

/* 下拉（「更多」与「关注人」共用一套）：原型只做开关，不接任何真实动作 */
document.addEventListener('click', e => {
  const wrap = e.target.closest('.more-wrap');
  document.querySelectorAll('.more-menu.on').forEach(m => {
    if (!wrap || m.parentElement !== wrap) {
      m.classList.remove('on');
      m.parentElement?.querySelector('[aria-expanded]')?.setAttribute('aria-expanded', 'false');
    }
  });
  if (!wrap) return;
  const trigger = e.target.closest('button');
  // 点的是触发器本身才开合；点菜单内部保持打开（否则刚展开就关）
  if (trigger && trigger.parentElement === wrap) {
    const menu = wrap.querySelector('.more-menu');
    const on = menu?.classList.toggle('on');
    trigger.setAttribute('aria-expanded', String(!!on));
  }
});
document.getElementById('stateBtn').onclick = () => { archived = !archived; render(); };
addEventListener('resize', () => { if (cur === 'D') fitRail(); });
function go(d){
  const i = keys.indexOf(cur);
  cur = keys[(i + d + keys.length) % keys.length];
  render();
}
document.getElementById('prev').onclick = () => go(-1);
document.getElementById('next').onclick = () => go(1);
addEventListener('keydown', e => {
  // 输入态不劫持方向键
  const t = e.target, tag = t.tagName;
  if (tag==='INPUT'||tag==='TEXTAREA'||t.isContentEditable) return;
  if (e.key==='ArrowLeft')  { e.preventDefault(); go(-1); }
  if (e.key==='ArrowRight') { e.preventDefault(); go(1); }
});
render();
</script>
</body>
